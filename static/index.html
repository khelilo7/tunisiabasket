  @font-face { font-family:"Barlow Condensed"; font-weight:800; font-display:swap; src:url(/fonts/BarlowCondensed-ExtraBold.ttf) format("truetype"); }
  @font-face { font-family:"Barlow Condensed"; font-weight:600; font-display:swap; src:url(/fonts/BarlowCondensed-SemiBold.ttf) format("truetype"); }
  :root, :root[data-theme=dark] { --bg:#0B1020; --card:#151D35; --line:rgba(255,255,255,.09); --hover:rgba(255,255,255,.05); --pill:rgba(255,255,255,.08); --track:rgba(255,255,255,.1);

    --glass:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015)); --shadow:0 10px 30px rgba(0,0,0,.28); }
  :root[data-theme=light] { --glass:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.7)); --shadow:0 8px 24px rgba(20,30,60,.08); }
  body { background:var(--bg); background-image:radial-gradient(1100px 520px at 10% -120px, rgba(91,76,255,.20), transparent 70%), radial-gradient(800px 420px at 95% -60px, rgba(238,75,82,.16), transparent 70%); background-repeat:no-repeat; background-attachment:fixed; }
  :root[data-theme=light] body { background-image:radial-gradient(1100px 520px at 10% -120px, rgba(91,76,255,.08), transparent 70%), radial-gradient(800px 420px at 95% -60px, rgba(238,75,82,.07), transparent 70%); }
  header { border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(255,138,31,.35); }
  /* computer only: on a phone a blur on the header would trap the fixed bottom menu inside it (a backdrop filter makes the header the menu's frame), so the menu

  @media (min-width:761px) {
    header { backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px); }

  }

// Instant navigation. GET /api/* answers are kept for a minute and shared by simultaneous requests (a page asking for what another page just asked costs nothing); any POST clears them so a vote
// or a save is never hidden; the pages likely to be opened next are fetched in advance (see prefetchFor). /api/live is never cached.
(() => {
  const native = window.fetch.bind(window), cache = new Map(), TTL = 60000;
  window.fetch = (input, init) => {
    const url = typeof input === 'string' ? input : input.url, method = ((init && init.method) || 'GET').toUpperCase();
    if (!url.startsWith('/api/')) return native(input, init);
    if (method !== 'GET') { cache.clear(); return native(input, init); }
    if (/^\/api\/(live|status|hit)/.test(url)) return native(input, init);
    const hit = cache.get(url);
    if (hit && Date.now() - hit.t < TTL) return hit.p.then(r => r.clone());
    const p = native(input, init).then(r => { if (!r.ok) cache.delete(url); return r; }, e => { cache.delete(url); throw e; });
    cache.set(url, { t: Date.now(), p });
    return p.then(r => r.clone());
  };
})();

    <td>${est(r, ['fgm', 'fga'], r.fgm + '/' + r.fga)}</td><td>${est(r, ['p3m', 'p3a'], r.p3m + '/' + r.p3a)}</td><td>${est(r, ['ftm', 'fta'], r.ftm + '/' + r.fta)}</td><td>${r.pm == null ? '–' : signed(r.pm)}</td><td>${dash(r.pir)}</td><td>${r.rating == null ? '–' : rate(r.rating)}</td></tr>`).join('')}
  </tbody></table></div>${p.log.some(r => r.est && r.est.length) ? `<div class="mut small" style="margin-top:6px"><i class="est">~</i> ${_('Estimated, not from the sheet: his average in his full box scores, adjusted so that the points add up. Points and rebounds are from the sheet. The averages above include these games.')}</div>` : ''}`;
}

function spark(v) {
  if (v.length < 2) return `<div class="mut">${_('Need at least 2 games for a trend.')}</div>`;
  const Wd = 600, Ht = 90, lo = Math.min(0, ...v), hi = Math.max(...v, 1), x = i => 10 + i * (Wd - 20) / (v.length - 1), y = n => Ht - 10 - (n - lo) / (hi - lo) * (Ht - 20);
  return `<svg class="spark" viewBox="0 0 ${Wd} ${Ht}" preserveAspectRatio="none" role="img" aria-label="PIR"><polyline fill="none" stroke="#ff8a1f" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${v.map((n, i) => x(i) + ',' + y(n)).join(' ')}"/></svg>`;
}

let gamesTeam = '';
async function games() {

  <div class="toolbar"><select id="gt" aria-label="${_('Team')}"><option value="">${_('All teams')}</option>${teams.map(([c, n]) => `<option value="${c}" ${c === gamesTeam ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    <span class="mut small">${list.length} ${_('Games').toLowerCase()}</span></div>

// ---------------------------------------------------------------- courts and lineups
// What a marker shows. The colour of a marker is always the player's rating tier; the number is the chosen metric.
const METRICS = {
  rating: ['Rating', v => Math.round(v)], pts: ['Points', v => v], reb: ['Rebounds', v => v], ast: ['Assists', v => v],
  stl: ['Steals', v => v], blk: ['Blocks', v => v], pir: ['PIR (efficiency)', v => v], min: ['Minutes', v => Math.round(v)],
  pm: ['Plus / minus', v => signed(Math.round(v))], fg_pct: ['FG %', v => Math.round(v)], p3_pct: ['3P %', v => Math.round(v)],
  ts_pct: ['True shooting %', v => Math.round(v)]
};
let metric = (localStorage.getItem('metric') in METRICS) ? localStorage.getItem('metric') : 'rating';
let courtData = null;   // what #court should draw: {kind:'team', lineup} or {kind:'game', g}

// Where the five roles stand on a half court whose basket is at the TOP (units: 0.1 ft, court 500 x 470).
const SPOT = { PG: [250, 332], SG: [420, 262], SF: [80, 262], PF: [336, 148], C: [184, 98] };
const shortName = n => { const t = title(n); return t.length > 16 ? t.slice(0, 15) + '…' : t; };

function halfLines(withBoundary) {
  return `<g fill="none" stroke="var(--court-line)" stroke-width="3" stroke-linecap="round">
    <rect x="170" y="0" width="160" height="190" fill="var(--court-paint)"/>
    <path d="M190 190 A60 60 0 0 0 310 190"/><path d="M190 190 A60 60 0 0 1 310 190" stroke-dasharray="7 7"/>
    <path d="M30 0 V142 A237.5 237.5 0 0 0 470 142 V0"/>
    <path d="M210 52.5 A40 40 0 0 0 290 52.5"/><path d="M220 40 H280"/>
    <circle cx="250" cy="52.5" r="9" stroke="var(--acc)" stroke-width="4"/>
    ${withBoundary ? '<rect x="0" y="0" width="500" height="470" rx="4"/><path d="M190 470 A60 60 0 0 1 310 470"/>' : ''}
  </g>`;
}

function marker(x, y, pl) {
  const v = METRICS[metric][1](pl[metric] ?? 0), big = String(v).length > 3;
  return `<g class="pl" data-go="${playerUrl(pl.id, pl.name)}" transform="translate(${x} ${y})"><title>${esc(title(pl.name))} · ${esc(posName(pl.pos))} · ${_('Rating')} ${pl.rating}</title>
    <text y="-39" text-anchor="middle" font-size="17" font-weight="700" fill="var(--mut)" stroke="var(--court)" stroke-width="4">${esc(posName(pl.spot || pl.pos))}</text>
    <circle class="dot" r="30" fill="${rcol(pl.rating)}" stroke="var(--court-line)" stroke-width="3"/>
    <text y="9" text-anchor="middle" font-size="${big ? 21 : 27}" font-weight="800" fill="#10131c">${v}</text>
    <text y="57" text-anchor="middle" font-size="19" font-weight="700" fill="var(--txt)" stroke="var(--court)" stroke-width="4">${esc(shortName(pl.name))}</text>
    <text y="77" text-anchor="middle" font-size="15" fill="var(--mut)" stroke="var(--court)" stroke-width="3">#${esc(pl.number)} · ${esc(posName(pl.pos))}</text></g>`;
}

function halfCourt(players) {   // one team around one basket
  return `<svg class="court half" viewBox="-8 -8 516 486" role="img" aria-label="${_('Starting five')}"><rect x="-8" y="-8" width="516" height="486" fill="var(--court-b)"/>

    ${players.map(p => marker(...SPOT[p.spot], p)).join('')}</svg>`;
}

function fullCourt(left, right) {   // two teams, each around its own basket; centres under the baskets, guards towards the middle
  const toL = (x, y) => [y, 500 - x], toR = (x, y) => [940 - y, x];
  const put = (t, fn) => t.players.map(p => marker(...fn(...SPOT[p.spot]), p)).join('');
  const lg = (code, x) => `<image href="/img/teams/${esc(code)}.png?v=2" x="${x}" y="4" width="46" height="46"/>`;
  return `<svg class="court" viewBox="-8 -8 956 516" role="img" aria-label="${_('Starting five')}"><rect x="-8" y="-8" width="956" height="516" fill="var(--court-b)"/>
    <rect x="0" y="0" width="940" height="500" fill="var(--court)"/>
    <g transform="translate(0 500) rotate(-90)">${halfLines(false)}</g><g transform="translate(940 0) rotate(90)">${halfLines(false)}</g>
    <g fill="none" stroke="var(--court-line)" stroke-width="3"><rect x="0" y="0" width="940" height="500" rx="4"/><path d="M470 0 V500"/><circle cx="470" cy="250" r="60"/></g>
    ${lg(left.code, 14)}<text x="64" y="36" font-size="26" font-weight="800" fill="var(--txt)" stroke="var(--court)" stroke-width="5">${esc(left.code)}${left.score != null ? ' · ' + left.score : ''}</text>
    ${lg(right.code, 884)}<text x="876" y="36" text-anchor="end" font-size="26" font-weight="800" fill="var(--txt)" stroke="var(--court)" stroke-width="5">${right.score != null ? right.score + ' · ' : ''}${esc(right.code)}</text>
    ${put(left, toL)}${put(right, toR)}</svg>`;
}

const legend = () => `<div class="legend"><span>${_('Marker colour = rating:')}</span>${[[90, 'elite 90+'], [75, 'strong 75+'], [60, 'solid 60+'], [45, 'average 45+'], [0, 'below 45']].map(([r, l]) => `<span><i class="sw" style="background:${rcol(r)}"></i> ${_(l)}</span>`).join(' ')}</div>`;

function metricPicker() {
  return `<label class="mut small" for="metric">${_('Show')}</label><select id="metric">${Object.entries(METRICS).map(([k, [l]]) => `<option value="${k}" ${k === metric ? 'selected' : ''}>${_(l)}</option>`).join('')}</select>`;
}

function drawCourt() {
  const el = $('#court');
  if (!el || !courtData) return;
  if (courtData.kind === 'team') {
    el.innerHTML = halfCourt(courtData.lineup) + legend();
  } else {
    const g = courtData.g, [a, b] = g.teams, L = g.lineups;
    const A = { code: a.code, score: a.points, players: L[a.code].starters }, B = { code: b.code, score: b.points, players: L[b.code].starters };
    el.innerHTML = `<div class="court-wide">${fullCourt(A, B)}</div>
      <div class="court-narrow"><div class="tl"><span class="tn">${logo(a.code, 28)}${esc(a.name)}</span><span>${a.points}</span></div>${halfCourt(A.players)}
      <div class="tl"><span class="tn">${logo(b.code, 28)}${esc(b.name)}</span><span>${b.points}</span></div>${halfCourt(B.players)}</div>` + legend();
  }
  bind();
}

     `<div class="card scroll"><table><thead><tr><th>#</th><th class="l">${_('Player')}</th><th>PTS</th><th>REB</th><th>${H('OR')}</th><th>${H('DR')}</th><th>${H('AST')}</th><th>${H('STL')}</th><th>${H('BLK')}</th><th>${H('FG')}</th><th>${H('2P')}</th><th>${H('3P')}</th><th>${H('FT')}</th></tr></thead><tbody>

       <td>${est(p, ['fgm', 'fga'], frac(p.fgm, p.fga))}</td><td>${est(p, ['fgm', 'fga', 'p3m', 'p3a'], frac(p.p2m, p.p2a))}</td><td>${est(p, ['p3m', 'p3a'], frac(p.p3m, p.p3a))}</td><td>${est(p, ['ftm', 'fta'], frac(p.ftm, p.fta))}</td></tr>`).join('')}
     ${t.complete ? `<tr class="tot"><td></td><td class="l">${_('Team')}</td><td>${sum('pts')}</td><td>${sum('reb')}</td><td>${sum('oreb')}</td><td>${sum('dreb')}</td><td>${sum('ast')}</td><td>${sum('stl')}</td><td>${sum('blk')}</td>

  if (!rows.length) return '';
  return `<h2>${_('Team comparison')}</h2><div class="card">${rows.map(([k, l]) => { const x = a.extra[k], y = b.extra[k], t = Math.max(1, x + y);

}

   ${rows.map(p => `<tr data-go="${playerUrl(p.id, p.name)}"><td>${esc(p.number)}</td><td class="l">${p.starter ? '<b>' : ''}${plink(p, esc(title(p.name)))}${p.starter ? '</b>' : ''}${g.mvp && g.mvp.player_id === p.id ? ' <span class="pill mvp">MVP</span>' : ''}</td><td class="mut">${esc(posName(p.pos))}</td>

     <td>${frac(sum('fgm'), sum('fga'))}</td><td>${frac(sum('p2m'), sum('p2a'))}</td><td>${frac(sum('p3m'), sum('p3a'))}</td><td>${frac(sum('ftm'), sum('fta'))}</td><td></td><td>${sum('pir')}</td><td></td></tr>
   ${l.dnp.map(p => `<tr class="mut"><td>${esc(p.number)}</td><td class="l">${esc(title(p.name))}</td><td colspan="19">${_('Did not play')}</td></tr>`).join('')}
   </tbody></table></div>`;
  };
  const bench = t => `<h2>${esc(f('benchOf', t.name))}</h2><div class="benchgrid">${L[t.code].bench.map(p => `<div class="bp" data-go="${playerUrl(p.id, p.name)}"><div class="n">${plink(p, esc(title(p.name)))}</div>

const PLAYOFF_N = 6;      // the six best go to the playoffs, the others to the playout
const zoneOf = rank => rank <= PLAYOFF_N ? 'po' : 'pl';
const zonePill = rank => `<span class="zone z-${zoneOf(rank)}">${rank <= PLAYOFF_N ? _('Playoff') : _('Playout')}</span>`;
// After the last game of a round, for one day: who went up, who went down (the server sends `movement` only then)
const moveTag = (mv, code) => { const m = mv && mv.moves ? mv.moves[code] : 0; return m > 0 ? `<span class="mv up" title="${esc(_('Places gained since the previous round'))}">▲${m}</span>` : m < 0 ? `<span class="mv dn" title="${esc(_('Places lost since the previous round'))}">▼${-m}</span>` : mv && mv.moves ? '<span class="mv eq">–</span>' : ''; };
function standTable(d, compact) {
  const top = new Set(d.top_teams), pf = LANG === 'fr' ? 'PM' : 'PF', pa = LANG === 'fr' ? 'PE' : 'PA';
  return `<div class="card scroll"><table><thead><tr><th>#</th><th class="l">${_('Team')}</th><th class="hm">J</th><th>${W}</th><th>${Ls}</th>${compact ? '' : `<th class="hm">${pf}</th><th class="hm">${pa}</th>`}<th>${_('Diff')}</th><th>${_('Pts')}</th>${compact ? '' : `<th class="hm" title="${_('Box scores available in the app')}">${_('Box scores')}</th>`}</tr></thead><tbody>
  ${d.standings.map(t => `<tr data-go="${teamUrl(t.code)}" class="${['zone-' + zoneOf(t.rank), t.rank === PLAYOFF_N ? 'zend' : '', t.code === favTeam ? 'fav' : ''].join(' ').trim()}"><td class="rkz">${t.rank}${moveTag(d.movement, t.code)}</td><td class="l"><span class="tn" style="flex-wrap:wrap"><a class="tn" href="${teamUrl(t.code)}">${logo(t.code, 32)}<span>${esc(t.name)}</span></a>${zonePill(t.rank)}${top.has(t.code) ? `<span class="mvpdot hm" title="${esc(_('MVP pool'))}">★</span>` : ''}</span></td><td class="hm">${t.j}</td><td>${t.w}</td><td>${t.l}</td>${compact ? '' : `<td class="hm">${t.pf}</td><td class="hm">${t.pa}</td>`}<td class="${t.diff >= 0 ? 'good' : 'bad'}">${signed(t.diff)}</td><td><b>${t.pts}</b></td>${compact ? '' : `<td class="mut hm">${t.box}/${t.j}</td>`}</tr>`).join('')}</tbody></table></div>`;
}

let COMP = { cup: true, finals: false, started: false, nat1_playoff: false };
const previewMode = () => new URLSearchParams(location.search).get('preview') === '1';      // the admin looks at a page that is not announced yet          // which competitions exist (from /api/competitions): the Cup always shows (an empty bracket says "draw soon"), the finals once they are set up
const leagueNav = on => `<div class="seg league" role="tablist"><a role="tab" aria-selected="${on === 'proa'}" class="${on === 'proa' ? 'on' : ''}" href="${url('standings')}">Pro A</a><a role="tab" aria-selected="${on === 'nat1'}" class="${on === 'nat1' ? 'on' : ''}" href="${url('nat1')}">${_('National One')}</a>${COMP.cup ? `<a role="tab" aria-selected="${on === 'cup'}" class="${on === 'cup' ? 'on' : ''}" href="${url('cup')}">🏆 ${_('Cup')}</a>` : ''}<a role="tab" aria-selected="${on === 'history'}" class="${on === 'history' ? 'on' : ''}" href="${url('history')}">🕘 ${_('History')}</a></div>`;
const finTab = ['finals', '🔥 ' + _('Play-off') + ' · ' + _('Play-out')];
// Once the play-off / play-out have started they take the place of the championship (regular-season) standings; the regular season stays under their "Regular season" tab
const standNav = on => leagueNav('proa') + `<div class="seg" role="tablist">${[...(COMP.started ? [finTab] : [['standings', '🏆 ' + _('Standings')]]), ['games', '🏀 ' + _('Games')], ['planning', '📅 ' + _('Planning')], ...(COMP.finals && !COMP.started ? [finTab] : [])].map(([k, l]) => `<a role="tab" aria-selected="${on === k}" class="${on === k ? 'on' : ''}" href="${url(k)}">${l}</a>`).join('')}</div>`;
// the law behind the order of every table, small on purpose: the FTBB's General Regulations, articles 182 to 184
const LAW_URL = 'https://www.ftbb.org.tn/wp-content/uploads/2025/11/Reglements-Generaux-de-la-FTBB_2024-2.pdf';
const lawNote = () => `<div class="lawnote">${_('Ranking as in the FTBB General Regulations (articles 182 to 184): 2 points for a win, 1 for a loss, 0 for a forfeit. Teams level on points are separated by the games between them (point difference), then by the point difference of all the games.')} <a href="${LAW_URL}" target="_blank" rel="noopener">${_('FTBB regulations')} ↗</a></div>`;
async function standings() {
  if (COMP.started) return finals();
  const d = await api('overview' + (new URLSearchParams(location.search).get('move') === '1' ? '?move=1' : ''));      // ?move=1 shows the last round's rises and falls whatever the date (to look at them)
  pageMeta = META.standings[LANG];
  if (d.seasons && d.season !== d.seasons[0]) {          // a past season: the official tables and series of the history, not a table rebuilt from the box scores we happen to have
    const h = await fetch('/api/history/' + encodeURIComponent(d.season)).then(r => r.ok ? r.json() : null).catch(() => null);
    if (h && h.sections.length) return `${standNav('standings')}<h1>${_('Standings')} <span class="mut" style="font-size:15px">${seasonLbl(d.season)}</span></h1>
      <div class="note">${_('A past season: the official tables, series and results come from the history; the box scores are in Games and Players.')} <a href="${url('history', d.season)}">🕘 ${_('History')} ${seasonLbl(d.season)}</a></div>${hSections(h.sections)}`;
  }
  return `${standNav('standings')}<h1>${_('Standings')} <span class="mut" style="font-size:15px">${esc(f('standingsSub', d.season))}</span></h1>${standTable(d, false)}
  ${d.movement ? `<div class="movebar">⚡ ${esc(f('moveNote', d.movement.matchday, fmtDay(d.movement.until)))}</div>` : ''}
  <div class="zlegend"><span><i class="z-po"></i>${_('Playoff')} · ${_('top 6')}</span><span><i class="z-pl"></i>${_('Playout')} · ${_('the other 6')}</span><span class="mut small"><b class="mvpdot">★</b> ${_('MVP pool')}</span></div>
  <div class="note">${_('Click a team for its match history and calendar.')} ${_('2 points for a win, 1 for a loss.')} ${_('Player stats only exist for games with a box score (last column).')} ${esc(f('topNote', d.top_teams.length))}</div>${lawNote()}`;
}

// ---------------------------------------------------------------- National One (the league below the Pro A): results and table only, no statistics
let n1Team = '';
const N1SUB = { en: { games: 'games', planning: 'calendar', playoff: 'play-off' }, fr: { games: 'matchs', planning: 'calendrier', playoff: 'playoff' } };
const nat1Url = tab => tab === 'standings' ? url('nat1') : url('nat1', N1SUB[LANG][tab]);
const n1Nav = on => `<div class="seg" role="tablist">${[['standings', '🏆 ' + _('Standings')], ['games', '🏀 ' + _('Games')], ['planning', '📅 ' + _('Planning')], ...(COMP.nat1_playoff || on === 'playoff' ? [['playoff', '🔥 ' + _('Play-off')]] : [])].map(([k, l]) => `<a role="tab" aria-selected="${on === k}" class="${on === k ? 'on' : ''}" href="${nat1Url(k)}">${l}</a>`).join('')}</div>`;
// Nationale 1 has the same three tabs as the Pro A: Standings, Games (the results) and Calendar (what is still to play)
async function nat1(arg) {
  const tab = Object.entries(N1SUB[LANG]).find(([, v]) => v === arg)?.[0] || 'standings';
  const d = await fetch('/api/nat1', { cache: 'no-cache' }).then(r => r.json());
  pageMeta = META.nat1[LANG];
  const badge = c => `<img class="tlogo" src="/img/teams/${esc(c)}.png?v=2" alt="" width="28" height="28" loading="lazy" onerror="this.outerHTML='<span class=&quot;ini&quot;>${esc(String(c).slice(0, 3))}</span>'">`, names = d.teams, official = d.official;
  const keep = m => ({ ...m, games: m.games.filter(g => !n1Team || g.home === n1Team || g.away === n1Team) });
  const played = d.matchdays.filter(m => m.played).map(keep).filter(m => m.games.length).reverse();
  const coming = d.matchdays.filter(m => !m.played).map(keep).filter(m => m.games.length);
  const pf = LANG === 'fr' ? 'PM' : 'PF', pa = LANG === 'fr' ? 'PE' : 'PA', hasPF = d.standings.some(t => t.pf != null);
  const head = `${leagueNav('nat1')}${n1Nav(tab)}<h1>${_('National One')} <span class="mut" style="font-size:15px">${esc(d.season)}</span></h1>`;
  if (!d.standings.length) return `${head}<div class="empty">${_('The National One results are coming soon.')}</div>`;
  const filter = `<div class="toolbar"><select id="n1t" aria-label="${_('Team')}"><option value="">${_('All teams')}</option>${Object.entries(names).sort((a, b) => a[1].localeCompare(b[1])).map(([c, n]) => `<option value="${esc(c)}" ${c === n1Team ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>`;
  const game = (g, isPlayed) => { const has = g.home_score != null, hw = has && g.home_score > g.away_score;
    return `<div class="n1g"><span class="tn ${hw ? 'win' : ''}">${badge(g.home)}<span>${esc(g.home_name)}</span></span><span class="n1c">${has ? `<b>${g.home_score} – ${g.away_score}</b>` : `<span class="mut small n1s">${isPlayed ? _('score missing') : _('to come')}</span>`}${g.date ? `<small>${esc(hDate(g.date))}</small>` : ''}</span><span class="tn ${has && !hw ? 'win' : ''}"><span>${esc(g.away_name)}</span>${badge(g.away)}</span></div>`; };
  const day = (m, isPlayed) => `<div class="card"><div class="row"><b>J${m.matchday}</b>${m.date ? `<span class="mut small">${esc(fmtDay(m.date))}</span>` : ''}${isPlayed && m.missing ? `<span class="mut small">· ${esc(f('scoresMissing', m.missing))}</span>` : ''}</div>${m.games.map(g => game(g, isPlayed)).join('')}</div>`;
  if (tab === 'playoff') {
    const po = d.playoff, fm = d.format;
    if (!d.playoff_on && !previewMode()) return `${head}<div class="empty">${_('The National One play-off starts at the end of the regular season. This page will come alive then.')}</div>`;
    if (!po) return `${head}<div class="empty">${_('The play-off will appear here once eight clubs are in the table.')}</div>`;
    const prom = po.promoted.length ? `<div class="card promoted"><div class="crown">⬆️ ${_('Promoted to the Pro A')}</div><div class="prow">${po.promoted.map(c => `<span class="tchip">${badge(c)}<b>${esc(names[c] || c)}</b></span>`).join('')}</div></div>` : '';
    return `${head}<div class="fpanel nat1po"><div class="fhead" style="margin-top:4px"><span class="fico">🔥</span><div><h2 style="margin:0;color:var(--acc)">${_('Play-off')}</h2><div class="mut small">${_('The first eight of the table play it: the two winners of the semi-finals go up to the Pro A, and meet in the final for the title.')}</div></div></div>
    ${po.seeds_final ? '' : `<div class="banner">${_('Provisional: the seeds follow the table as it stands, and change until the regular season is over.')}</div>`}
    ${prom}${seriesBracket(po, { key: 'nat1', promote: po.promote_round })}
    <div class="note">${_('Quarter-finals and semi-finals: series of three games (the first game, and a decider if needed, at the better ranked club). The final is a single game on neutral ground.')} ${fm.confirmed ? '' : esc(f('n1Source', fm.season))} <a href="${esc(fm.source)}" target="_blank" rel="noopener">FTBB ↗</a></div></div>`;
  }
  if (tab === 'games') return `${head}${filter}<div class="grid n1grid">${played.map(m => day(m, true)).join('') || `<div class="empty">${_('No games.')}</div>`}</div>`;
  if (tab === 'planning') return `${head}${filter}${coming.length ? `<h2>${_('Next games')}</h2><div class="grid n1grid">${coming.slice(0, 2).map(m => day(m, false)).join('')}</div>${coming.length > 2 ? `<details class="fold" style="margin-top:10px"><summary><span>${_('Full calendar')}</span><span class="sub mut">J${coming[2].matchday}–J${coming.at(-1).matchday}</span><span class="chev">▾</span></summary><div class="grid n1grid" style="margin-top:10px">${coming.slice(2).map(m => day(m, false)).join('')}</div></details>` : ''}` : `<div class="empty">${_('No games.')}</div>`}`;
  const table = `<div class="card scroll"><table class="n1table"><thead><tr><th>#</th><th class="l">${_('Team')}</th><th>J</th><th>${W}</th><th>${Ls}</th>${hasPF ? `<th class="hm">${pf}</th><th class="hm">${pa}</th>` : ''}<th>${_('Diff')}</th><th>${_('Pts')}</th></tr></thead><tbody>
    ${d.standings.map(t => `<tr style="cursor:default" class="${t.rank <= d.format.playoff ? 'zone-po' : 'zone-cup'}${t.rank === d.format.playoff ? ' zend' : ''}"><td class="rkz">${t.rank}</td><td class="l"><span class="tn">${badge(t.code)}<span>${esc(t.name)}</span></span>${t.rank <= d.format.playoff ? `<span class="zone z-po">${_('Play-off')}</span>` : `<span class="zone z-cup">${_('League Cup')}</span>`}</td><td>${t.j}</td><td>${t.w}</td><td>${t.l}</td>${hasPF ? `<td class="hm">${t.pf}</td><td class="hm">${t.pa}</td>` : ''}<td class="${t.diff >= 0 ? 'good' : 'bad'}">${signed(t.diff)}</td><td><b>${t.pts}</b></td></tr>`).join('')}</tbody></table></div>`;
  const fm = d.format, steps = [['1', f('n1Step1', fm.playoff)], ['2', _('Play-off quarter-finals: 1st v 8th, 2nd v 7th, 3rd v 6th, 4th v 5th. Each is a series of three games (the first game, and a decider if needed, at the better ranked club).')],
    ['3', _('Semi-finals, the same way: the winner of 1-8 v the winner of 4-5, the winner of 2-7 v the winner of 3-6.')], ['⬆️', `${_('The two semi-final winners go up to the Pro A.')}`], ['🏆', _('They play the final in a single game on neutral ground: the champion of the Nationale 1.')]];
  const promo = `<div class="card promo"><div class="crown">⬆️ ${_('How to go up to the Pro A')}</div><ol class="pstep">${steps.map(([n, t]) => `<li><span class="pn">${n}</span><span>${esc(t)}</span></li>`).join('')}</ol>
    <div class="mut small">${_('The clubs below the eighth place play the League Cup instead.')} ${fm.confirmed ? '' : esc(f('n1Source', fm.season))} <a href="${esc(fm.source)}" target="_blank" rel="noopener">FTBB ↗</a>${d.playoff_on || previewMode() ? ` · <a href="${nat1Url('playoff')}">🔥 ${_('See the play-off')}</a>` : ''}</div></div>`;
  return `${head}${table}
  <div class="zlegend"><span><i class="z-po"></i>${esc(f('n1Legend', fm.playoff))}</span><span><i class="z-cup"></i>${_('League Cup')}</span></div>
  ${promo}
  <div class="note">${official ? esc(f('nat1Official', official.source, fmtDay(official.published))) + ' ' + (official.since ? esc(f('nat1Since', official.since)) + ' ' : '') : ''}${_('2 points for a win, 1 for a loss.')} ${_('We only have results for the National One: there are no player or box-score statistics yet.')}</div>${lawNote()}`;
}

// ---------------------------------------------------------------- Cup: a knockout bracket of Pro A and Nationale 1 clubs, one game per tie
let cupRound = null;
const lgTag = l => l === 'proa' ? '<i class="lg a" title="Pro A">A</i>' : l === 'nat1' ? '<i class="lg n" title="' + esc(_('National One')) + '">N1</i>' : '';
function cupSide(x, score, win, lose) {
  if (x.bye) return `<div class="ts bye"><span class="mut small">${_('Bye: goes through')}</span></div>`;
  if (x.code) return `<div class="ts${win ? ' w' : ''}${lose ? ' l' : ''}">${logo(x.code, 24)}<span class="tnm">${esc(x.name)}</span>${lgTag(x.league)}<b>${score ?? ''}</b></div>`;
  return `<div class="ts tbd"><span class="mut small">${x.label ? esc(_('Winner of')) + ' ' + esc(x.label) : _('To be drawn')}</span></div>`;
}
function cupTie(t) {
  const hw = t.winner && t.winner === t.home.code, aw = t.winner && t.winner === t.away.code;
  return `<div class="tie${t.upset ? ' upset' : ''}${t.played ? ' played' : ''}">${cupSide(t.home, t.home_score, hw, aw)}${cupSide(t.away, t.away_score, aw, hw)}
    <div class="tm">${t.upset ? `<span class="ups">⚡ ${_('Upset')}</span>` : ''}${t.date && !t.played ? `<span>${esc(fmtDate(t.date))}</span>` : t.played && t.date ? `<span class="mut">${esc(fmtDate(t.date))}</span>` : ''}${t.note ? `<span class="mut">${esc(t.note)}</span>` : ''}</div></div>`;
}
async function cup() {
  const d = await fetch('/api/cup', { cache: 'no-cache' }).then(r => r.json());
  pageMeta = META.cup[LANG];
  if (cupRound === null || cupRound >= d.rounds.length) cupRound = d.current;
  const head = `${leagueNav('cup')}<div class="cuphero card"><div class="ch1"><span class="trophy">🏆</span><div><h1 style="margin:0">${esc(d.name)}</h1><div class="mut">${esc(d.season)}</div></div></div>
    ${d.rounds.length ? `<div class="cstats"><span class="pill">${Object.values(d.clubs).reduce((a, b) => a + b, 0)} ${_('clubs')}</span><span class="pill w">${d.clubs.proa} Pro A</span><span class="pill">${d.clubs.nat1} ${_('National One')}</span><span class="pill">${d.games} ${_('Games').toLowerCase()}</span>${d.upsets ? `<span class="pill mvp">⚡ ${d.upsets} ${d.upsets > 1 ? _('upsets') : _('upset')}</span>` : ''}</div>` : ''}
    <p class="mut" style="margin:10px 0 0">${_('Clubs of the Pro A and of the National One meet in single games: the winner goes through to the next round.')}</p></div>
    ${d.demo ? `<div class="banner">${_('Demonstration data: the real draw is not out yet.')}</div>` : ''}`;
  if (!d.rounds.length) return `${head}<div class="empty">${_('The draw of the Cup will appear here.')}</div>`;
  const champ = d.champion ? `<div class="card winner"><div class="trophy">🏆</div><div><div class="crown">${_('Cup winner')}</div><div class="nm">${logo(d.champion.code, 64)}<span>${esc(d.champion.name)}</span></div></div></div>` : '';
  const cols = d.rounds.map((r, ri) => { const last = ri === d.rounds.length - 1, ties = r.ties.map(cupTie);
    const inner = last ? ties.join('') : ties.reduce((acc, t, i) => i % 2 ? acc : acc + `<div class="pair">${t}${ties[i + 1] || ''}</div>`, '');
    return `<div class="bcol${last ? ' last' : ''}"><div class="bhead"><b>${esc(r.name)}</b>${r.date ? `<span class="mut small">${esc(fmtDay(r.date))}</span>` : ''}${r.done ? '<span class="pill w">✓</span>' : ''}</div><div class="bties">${inner}</div></div>`; });
  const chips = d.rounds.map((r, i) => `<button class="rchip${i === cupRound ? ' on' : ''}" data-cupr="${i}">${esc(r.name)}${r.done ? ' ✓' : ''}</button>`).join('');
  return `${head}${champ}
  <div class="bracketwrap"><div class="bracket">${cols.join('')}</div></div>
  <div class="cuplist"><div class="rchips">${chips}</div><div class="grid g2">${d.rounds[cupRound].ties.map(cupTie).join('')}</div></div>
  <div class="note">${_('⚡ Upset: a club of a lower division beats a club of a higher one.')}</div>`;
}


// ---------------------------------------------------------------- History: the past seasons
const seasonLbl = x => String(x).replace('-', '/');
const hName = x => x === 'Final' ? _('Championship final') : _(x);      // 'Final' alone is already "Terminé" (a game that is over) in the dictionary
const hDate = d => new Date(d + 'T12:00').toLocaleDateString(LANG === 'fr' ? 'fr-FR' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const hTeam = (code, name) => `<span class="tn">${code ? logo(code, 20) : ''}<span>${esc(name || code || '?')}</span></span>`;
function hTable(rows) {
  const pf = rows.some(r => r.pf != null), pts = rows.some(r => r.pts != null);
  return `<div class="card scroll"><table class="ftable"><thead><tr><th>#</th><th class="l">${_('Team')}</th><th>${_('GP')}</th><th>${W}</th><th>${Ls}</th>${pf ? `<th>${_('Diff')}</th>` : ''}${pts ? `<th>${_('Pts')}</th>` : ''}</tr></thead><tbody>${rows.map(r =>
    `<tr style="cursor:default"><td class="rkz">${r.rank}</td><td class="l">${hTeam(r.code, r.name)}</td><td>${r.j}</td><td>${r.w}</td><td>${r.l}</td>${pf ? `<td>${r.pf != null ? signed(r.pf - r.pa) : ''}</td>` : ''}${pts ? `<td><b>${r.pts ?? ''}</b></td>` : ''}</tr>`).join('')}</tbody></table></div>`;
}
function hSeries(list) {
  return `<div class="grid g2">${list.map(s => {
    const wa = s.wins ? s.wins[0] : s.aggregate ? +(s.aggregate[0] > s.aggregate[1]) : s.games.filter(g => g[0] > g[1]).length, wb = s.wins ? s.wins[1] : s.aggregate ? +(s.aggregate[1] > s.aggregate[0]) : s.games.filter(g => g[1] > g[0]).length;
    const box = (s.box || []), games = s.games.map((g, i) => box[i] ? `<a href="${gameUrl(box[i])}">${g[0]}–${g[1]}</a>` : `${g[0]}–${g[1]}`).join(' · ');
    const agg = s.aggregate ? `${_('Aggregate')} ${s.aggregate[0]}–${s.aggregate[1]}` : '';
    return `<div class="card hser"><div class="mut small">${esc(hName(s.round || ''))}${s.dates ? ` · ${esc(s.dates)}` : ''}${s.note ? ` · ${esc(_(s.note))}` : ''}</div>
      <div class="hrow"><span class="${wa > wb ? 'hw' : ''}">${hTeam(s.a.code, s.a.name)}</span><b class="hsc">${wa}–${wb}</b><span class="${wb > wa ? 'hw' : ''}">${hTeam(s.b.code, s.b.name)}</span></div>
      <div class="mut small">${games || agg}</div></div>`;
  }).join('')}</div>`;
}
function hGames(games) {
  const one = g => {
    const h = g.home && g.home.code !== undefined ? g.home : { code: g.home, name: g.home }, a = g.away && g.away.code !== undefined ? g.away : { code: g.away, name: g.away };
    const sc = `${g.hs}–${g.as}`;
    return `<div class="hg"><span class="${g.hs > g.as ? 'hw' : ''}">${hTeam(h.code, h.name)}</span><b class="hsc">${g.box ? `<a href="${gameUrl(g.box)}">${sc}</a>` : sc}</b><span class="${g.as > g.hs ? 'hw' : ''}">${hTeam(a.code, a.name)}</span>${g.date ? `<span class="mut small hd">${esc(fmtDate(g.date))}</span>` : (g.date_text ? `<span class="mut small hd">${esc(g.date_text)}</span>` : '')}</div>`;
  };
  const html = `<div class="hgrid">${games.map(one).join('')}</div>`;

// ---------------------------------------------------------------- Play-off and play-out, with the season behind them
let fTab = 'playoff', fStage = 0, raceSel = '';
const dots = (n, need) => Array.from({ length: need }, (_x, i) => `<i class="dot${i < n ? ' on' : ''}"></i>`).join('');
function rankRaceChart(h) {

  const lines = codes.map((c, i) => { const rk = h.teams[c].ranks, on = !raceSel || raceSel === c, pts = rk.map((r, k) => r == null ? null : [px(k), py(r)]).filter(Boolean);

  return `<div class="card race"><svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${esc(_('Race of the standings'))}">${grid}${lines}</svg>
    <div class="rleg">${codes.map((c, i) => `<button class="rchip${raceSel === c ? ' on' : ''}" data-racesel="${esc(c)}"><i style="background:${color(c, i)}"></i>${esc(c)}</button>`).join('')}</div></div>`;
}

const ballMark = (g, code) => `<span class="hb">${g.ball && g.ball.team === code ? `<span class="hasball" title="${esc(_('Possession'))}">🏀</span>` : ''}</span>`;
// the two teams side by side: shooting, rebounds, assists..., and the scoring lines (paint, second chance, fast break, off turnovers, bench) when the analyst tagged baskets; the better figure of each line is lit
// one line of a comparison: the two values with a thin bar from the centre (orange = the first team, blue = the second); the better figure is bold and its bar full colour
const lvBest = (x, y, better) => x !== null && y !== null && x !== y && (x - y) * better > 0;
const lvWid = (x, y) => { const m = Math.max(x || 0, y || 0); return m ? Math.round(100 * (x || 0) / m) : 0; };
function liveRow([label, ta, tb, va, vb, better = 1]) {
  const ba = lvBest(va, vb, better), bb = lvBest(vb, va, better);

  const hide = () => { box.classList.remove('on'); clearTimeout(timer); };
  const show = el => {
    const t = (TIPS[LANG] || TIPS.en)[el.dataset.tip]; if (!t) return;
    box.innerHTML = `<b>${esc(t[0])}</b> · ${esc(t[1])}`; box.style.left = '0px'; box.style.top = '0px'; box.classList.add('on');
    const r = el.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
    box.style.top = (r.top - h - 10 > 8 ? r.top - h - 10 : r.bottom + 10) + 'px';
    clearTimeout(timer); timer = setTimeout(hide, 6000);
  };
  document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('.tip'); if (t) show(t); });
  document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('.tip')) hide(); });
  document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('.tip'); if (t) show(t); });
  document.addEventListener('focusout', hide);
  document.addEventListener('click', e => { const t = e.target.closest && e.target.closest('.tip'); if (t && matchMedia('(hover: none)').matches) show(t); else hide(); }, true);
  window.addEventListener('scroll', hide, { passive: true });
})();
// On a phone the first columns of a wide table (rank / number and name) stay in view while the rest slides
function stickyCols() {
  document.querySelectorAll('#app .scroll table').forEach(t => {
    const box = t.parentElement, head = t.tHead && t.tHead.rows[0];
    t.querySelectorAll('.s1, .s2').forEach(c => c.classList.remove('s1', 's2'));
    if (!head || !matchMedia('(max-width:760px)').matches || t.scrollWidth <= box.clientWidth + 2) return;
    const w1 = head.cells[0].getBoundingClientRect().width, two = w1 < 64 && head.cells.length > 2 && head.cells[1].classList.contains('l');
    if (two) t.style.setProperty('--l2', Math.round(w1) + 'px');
    t.querySelectorAll('tr').forEach(r => { if (r.cells.length < 3 || r.cells[0].colSpan > 1) return; r.cells[0].classList.add('s1'); if (two) r.cells[1].classList.add('s2'); });
  });
}
let stickyTimer; addEventListener('resize', () => { clearTimeout(stickyTimer); stickyTimer = setTimeout(stickyCols, 150); });
function bind() {
  decorateTips(); stickyCols();
  document.querySelectorAll('[data-go]').forEach(el => el.onclick = e => { if (e.target.closest('a')) return; go(el.dataset.go); });
  document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => { const k = th.dataset.sort; sortDir = sortKey === k ? -sortDir : -1; sortKey = k; route(true); });
  const qi = $('#q'); if (qi) { qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; route(true).then(() => { const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); }); }; }
  document.querySelectorAll('[data-lead]').forEach(c => c.onclick = e => { if (!e.target.closest('a')) openLeaders(c.dataset.lead); });
  const ql = $('#qual'); if (ql) { ql.onclick = () => { qualOnly = !qualOnly; route(true); }; ql.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ql.click(); } }; }
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => castVote(b.dataset.vote));
  document.querySelectorAll('[data-rvote]').forEach(b => b.onclick = () => castRoundVote(+b.dataset.round, b.dataset.rvote));
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => castPick(b.dataset.pick, b.dataset.side));
  document.querySelectorAll('[data-split]').forEach(b => b.onclick = () => { teamSplit = b.dataset.split; route(true); });
  document.querySelectorAll('[data-psplit]').forEach(b => b.onclick = () => { playerSplit = b.dataset.psplit; route(true); });
  document.querySelectorAll('[data-follow]').forEach(b => b.onclick = async () => { await setFav(favTeam === b.dataset.follow ? '' : b.dataset.follow); route(true); });
  document.querySelectorAll('[data-followopen]').forEach(b => b.onclick = openFollow);
  document.querySelectorAll('[data-followlater]').forEach(b => b.onclick = () => { try { localStorage.setItem('fdismiss', String(Date.now())); } catch (e) { /* ignore */ } route(true); });
  const pf = $('#phasefold'); if (pf) pf.ontoggle = () => { phaseOpen = pf.open; };
  const sf = $('#statsfold'); if (sf) sf.ontoggle = () => { chartOpen = sf.open; };
  const lf = $('#leadfold'); if (lf) lf.ontoggle = () => { leadOpen = lf.open; };
  const ma = $('#mvpall'); if (ma) ma.onclick = () => { mvpAll = !mvpAll; route(true); };
  const tf = $('#tf'); if (tf) tf.onchange = () => { teamF = tf.value; route(true); };
  const pt = $('#pt'); if (pt) pt.onchange = () => { planTeam = pt.value; route(true); };
  document.querySelectorAll('[data-cupr]').forEach(b => b.onclick = () => { cupRound = +b.dataset.cupr; route(true); });
  document.querySelectorAll('[data-ftab]').forEach(b => b.onclick = () => { fTab = b.dataset.ftab; route(true); });
  document.querySelectorAll('[data-fstage]').forEach(b => b.onclick = () => { fStage = +b.dataset.fstage; route(true); });
  document.querySelectorAll('[data-racesel]').forEach(b => b.onclick = () => { raceSel = raceSel === b.dataset.racesel ? '' : b.dataset.racesel; route(true); });
  document.querySelectorAll('.race .rl').forEach(g => g.onclick = () => { raceSel = raceSel === g.dataset.race ? '' : g.dataset.race; route(true); });
  const n1 = $('#n1t'); if (n1) n1.onchange = () => { n1Team = n1.value; route(true); };
  const gt = $('#gt'); if (gt) gt.onchange = () => { gamesTeam = gt.value; route(true); };
  const mt = $('#metric'); if (mt) mt.onchange = () => { metric = mt.value; localStorage.setItem('metric', metric); drawCourt(); };
}

// links inside the site move between pages without reloading
document.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target || a.origin !== location.origin) return;
  if (!parsePath(a.pathname)) return;
  e.preventDefault();
  go(a.pathname);
});
addEventListener('popstate', () => route());

// old bookmarks like /#/team/CA -> /team/CA
if (location.hash.startsWith('#/')) {
  const [, pg, arg] = location.hash.split('/');
  const page = { teams: 'standings', '': 'home' }[pg] ?? pg;
  if (SLUG.en[page] || page === 'home') history.replaceState(null, '', url(page, arg));
}
// a visitor who chose English earlier goes straight to the English home page (deep links and search engines are never redirected)
if (location.pathname === '/' && localStorage.getItem('lang') === 'en') location.replace('/en/');

renderClubBtn(); $('#clubbtn').onclick = openFollow; updateHot();
fetch('/api/competitions').then(r => r.json()).then(c => { const changed = c.finals !== COMP.finals || c.cup !== COMP.cup || c.started !== COMP.started || c.nat1_playoff !== COMP.nat1_playoff; COMP = c; if (changed) route(true); }).catch(() => {});
$('#predbtn').lastElementChild.textContent = _('Predictions');
$('#theme').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
$('#theme').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('#lang').value = LANG;
$('#lang').onchange = e => { localStorage.setItem('lang', e.target.value); const r = parsePath(location.pathname) || { page: 'home' }; location.href = url(r.page, r.arg, e.target.value); };
$('#season').onchange = e => { season = e.target.value; localStorage.setItem('season', season); route(true); };
fetch('/admin/api/me', { credentials: 'same-origin' }).then(r => r.json()).then(m => { $('#syncbtn').hidden = !m.admin; }).catch(() => {});  // Sync is for the admin only
$('#syncbtn').onclick = async () => {
  const b = $('#syncbtn'); b.textContent = '⟳ ' + _('Syncing…');
  const r = await fetch('/api/sync', { method: 'POST', credentials: 'same-origin' });
  if (!r.ok) { b.textContent = '⟳ ' + _('Sync'); alert(_('Admin login required: open /admin and log in first.')); return; }
  for (let i = 0; i < 120; i++) { await new Promise(r => setTimeout(r, 3000)); const s = await (await fetch('/api/status', { credentials: 'same-origin' })).json(); if (!s.running) break; }
  b.textContent = '⟳ ' + _('Sync'); route(true);
};
(async () => {  // fill the season picker on every page
  const d = await api('overview');
  $('#season').innerHTML = d.seasons.map(x => `<option ${x === d.season ? 'selected' : ''}>${x}</option>`).join('');
  $('#season').closest('label').hidden = d.seasons.length < 2;
})();
route(true).then(() => {
  // once the first page is there: warm the likely next pages, then follow the pointer (a hover or a touch on a link fetches what that page needs)
  const idle = window.requestIdleCallback || (f => setTimeout(f, 600));
  idle(() => ['standings', 'nat1', 'games', 'players', 'predict'].forEach((pg, i) => setTimeout(() => prefetchFor(url(pg)), i * 150)));
  const near = e => { const a = e.target.closest && e.target.closest('a[href]'); if (a && a.origin === location.origin) prefetchFor(a.pathname); };
  document.addEventListener('pointerover', near, { passive: true }); document.addEventListener('touchstart', near, { passive: true });
  maybeAskClub();
});
setInterval(() => { const d = $('#deadline'); if (d) d.innerHTML = '⏳ ' + deadlineLine(d.dataset.open === '1', +d.dataset.ts); }, 30000);
// auto-refresh data every 2 minutes so new games appear without reloading
setInterval(() => { if (!document.hidden && !document.activeElement.matches('input')) route(true); }, 120000);

$('#phase').title = _('Current competition phase'); $('#theme').title = _('Switch between dark and light mode'); $('#theme').setAttribute('aria-label', _('Switch between dark and light mode'));
$('#syncbtn').title = _('Check Google Drive for new box scores now'); $('#syncbtn').textContent = '⟳ ' + _('Sync'); $('#lang').title = _('Language');
</script>
