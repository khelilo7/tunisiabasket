  /* polish: depth, motion, tables, focus */
  :root, :root[data-theme=dark] { --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px rgba(0,0,0,.28); --ov:rgba(5,8,16,.72); }
  :root[data-theme=light] { --shadow:0 1px 2px rgba(24,32,47,.06), 0 8px 22px rgba(24,32,47,.07); --ov:rgba(24,32,47,.45); }

  tbody tr { transition:background .12s; } tbody tr:last-child { border-bottom:0; } tbody tr:hover td:first-child { box-shadow:inset 3px 0 0 var(--acc); }
  td.rk { color:var(--mut); font-variant-numeric:tabular-nums; width:34px; } td.rk.t3 { color:var(--acc); font-weight:800; }
  td, th { font-variant-numeric:tabular-nums; } td.l, th.l { text-align:left; }

const pre = l => (l === DEFAULT ? '' : '/' + l);
const url = (page, arg, lang = LANG) => page === 'home' ? pre(lang) + '/' : `${pre(lang)}/${SLUG[lang][page]}${arg ? '/' + arg : ''}`;
const slugify = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

const gameUrl = id => url('game', id), teamUrl = code => url('team', code);
function parsePath(p) {
  let lang = DEFAULT;
  for (const o of ['en']) if (p === '/' + o || p.startsWith('/' + o + '/')) { lang = o; p = p.slice(o.length + 1) || '/'; }
  const parts = p.split('/').filter(Boolean);
  if (!parts.length) return { lang, page: 'home' };
  const page = Object.keys(SLUG[lang]).find(k => SLUG[lang][k] === parts[0]);
  if (!page || parts.length > 2) return null;
  return { lang, page, arg: parts[1] ? decodeURIComponent(parts[1]) : undefined };
}

// keeps the tab title, description, canonical and language links right when moving between pages without a reload
function setMeta(titleText, desc) {
  document.title = titleText;
  const set = (sel, attr, v) => { const el = document.querySelector(sel); if (el && v != null) el.setAttribute(attr, v); };
  set('meta[name=description]', 'content', desc); set('meta[property="og:title"]', 'content', titleText); set('meta[name="twitter:title"]', 'content', titleText);
  set('meta[property="og:description"]', 'content', desc); set('meta[name="twitter:description"]', 'content', desc);
  set('link[rel=canonical]', 'href', location.origin + location.pathname); set('meta[property="og:url"]', 'content', location.origin + location.pathname);
  const r = parsePath(location.pathname);
  if (r) ['en', 'fr'].forEach(l => set(`link[rel=alternate][hreflang=${l}]`, 'href', location.origin + url(r.page, r.arg, l)));
}

// Page-view counter: one small anonymous beacon per page the visitor opens (no cookie; see traffic.py). Filters on a page do not count.
let tracked = '', firstView = true;
function track() {
  if (location.pathname === tracked) return;
  tracked = location.pathname;
  try { navigator.sendBeacon('/api/hit', new Blob([JSON.stringify({ path: location.pathname, lang: LANG, ref: firstView ? document.referrer : '' })], { type: 'application/json' })); } catch (e) { /* ignore */ }
  firstView = false;
}

async function route(keepScroll) {
  const r = parsePath(location.pathname) || { lang: LANG, page: 'home' };
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.p === ({ team: 'standings' }[r.page] || r.page)));
  const app = $('#app');
  courtData = null; pageMeta = null;
  try {
    app.innerHTML = await ({ home, standings, players, games, planning, team, player, game }[r.page] || home)(r.arg);
    bind();
    drawCourt();
    if (pageMeta) setMeta(...pageMeta);
    track();
  } catch (e) { app.innerHTML = `<div class="empty">${_('Could not load this page')} (${esc(e.message)}).</div>`; }
  if (!keepScroll) window.scrollTo(0, 0);
}

// Height / weight / birth date of a player (only what is known). Estimated values get a "~", disagreeing sources a range.
function bioLine(b) {
  if (!b) return '';
  const ap = k => (b.approx || []).includes(k) ? '~' : '', age = b.birth && Math.floor((Date.now() - new Date(b.birth + 'T12:00')) / 31557600000);
  const h = b.height && (Array.isArray(b.height) ? b.height.join('–') : b.height);
  const bits = [[_('Height'), h && `${ap('height')}${h} cm`], [_('Weight'), b.weight && `${ap('weight')}${b.weight} kg`],
    [_('Born'), b.birth && new Date(b.birth + 'T12:00').toLocaleDateString(LANG === 'fr' ? 'fr-FR' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' })],
    [_('Age'), age && `${age} ${_('yrs')}`]].filter(x => x[1]);
  return bits.length ? `<div class="bio">${bits.map(([l, v]) => `<span><span class="mut">${l}</span> <b>${esc(v)}</b></span>`).join('')}</div>` : '';
}

async function player(ref) {
  const id = (ref.match(/^([a-z0-9]+-\d+)/) || [, ref])[1];

  const pts = p.log.map(r => r.pir);
  return `<a class="mut" href="${url('players')}">← ${_('Players')}</a>
  <div class="card row" style="margin-top:10px;gap:20px">${ring(p.rating)}
    <div class="sp"><h1 style="margin:0">${esc(p.name)}</h1>
      <div class="mut">${p.teams.map(c => `<a class="tn" href="${teamUrl(c)}">${logo(c, 24)}${esc(c)}</a>`).join(' → ')} · #${p.number} · ${posName(p.pos)} · ${esc(f('seasonOf', d.season))}</div>
      ${bioLine(p.bio)}<div style="margin-top:6px">${d.rank ? `<span class="pill">${esc(f('race', d.rank, d.of))}</span> ` : `<span class="pill">${p.qualified ? esc(f('notPool', d.top_teams.length)) : _('Not enough games to rank')}</span> `}
      ${d.rank === 1 ? `<span class="pill mvp">${_('★ SEASON MVP')}</span> ` : ''}${p.mvp_games ? `<span class="pill mvp">${esc(f('mvpCount', p.mvp_games))}</span> ` : ''}<span class="pill w">${p.wins}${W}</span> <span class="pill l">${p.gp - p.wins}${Ls}</span></div></div></div>
  <h2>${esc(f('avgTitle', p.gp))}</h2>
  <div class="grid g4">${[['PTS', p.pts], ['REB', p.reb], [H('AST'), p.ast], [H('STL'), p.stl], [H('BLK'), p.blk], [H('TOV'), p.tov], ['MIN', p.min], ['+/-', signed(p.pm)],
      [H('FG%'), p.fg_pct], [H('3P%'), p.p3_pct], [H('FT%'), p.ft_pct], [H('TS%'), p.ts_pct], ['PIR', p.pir]].map(([l, v]) => `<div class="card stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
  <h2>${_('Form (PIR per game)')}</h2><div class="card">${spark(pts)}<div class="note">${_('Rating = FIBA Performance Index (PTS+REB+AST+STL+BLK+FD − misses − TOV − fouls), scaled 0–99. Game MVP = best PIR + 2 on the winning team only. Season MVP = best average among players of the top 4 teams.')}</div></div>
  <h2>${_('Game log')}</h2>
  <div class="card scroll"><table><thead><tr><th>${_('Date')}</th><th class="l">${_('Opp')}</th><th>${_('Result')}</th><th>MIN</th><th>PTS</th><th>REB</th><th>${H('AST')}</th><th>${H('STL')}</th><th>${H('BLK')}</th><th>${H('TOV')}</th><th>${H('FG')}</th><th>${H('3P')}</th><th>${H('FT')}</th><th>+/-</th><th>PIR</th><th>${H('RTG')}</th></tr></thead><tbody>
  ${[...p.log].reverse().map(r => `<tr data-go="${gameUrl(r.game_id)}"><td class="l">${fmtDate(r.date)}</td><td class="l">${r.team !== p.team ? esc(r.team) + ' ' : ''}<span class="tn">${_('vs')} ${logo(r.opp, 22)}<a href="${gameUrl(r.game_id)}">${esc(r.opp)}</a></span>${r.is_mvp ? ' <span class="pill mvp">MVP</span>' : ''}</td>
    <td><span class="${r.won ? 'good' : 'bad'}">${r.won ? W : Ls}</span> ${r.score}</td><td>${Math.round(r.min)}</td><td>${r.pts}</td><td>${r.reb}</td><td>${r.ast}</td><td>${r.stl}</td><td>${r.blk}</td><td>${r.tov}</td>
    <td>${r.fgm}/${r.fga}</td><td>${r.p3m}/${r.p3a}</td><td>${r.ftm}/${r.fta}</td><td>${signed(r.pm)}</td><td>${r.pir}</td><td>${rate(r.rating)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function spark(v) {
  if (v.length < 2) return `<div class="mut">${_('Need at least 2 games for a trend.')}</div>`;
  const Wd = 600, Ht = 90, lo = Math.min(0, ...v), hi = Math.max(...v, 1), x = i => 10 + i * (Wd - 20) / (v.length - 1), y = n => Ht - 10 - (n - lo) / (hi - lo) * (Ht - 20);
  return `<svg class="spark" viewBox="0 0 ${Wd} ${Ht}" preserveAspectRatio="none" role="img" aria-label="PIR"><polyline fill="none" stroke="#ff8a1f" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${v.map((n, i) => x(i) + ',' + y(n)).join(' ')}"/></svg>`;
}

async function games() {
  const d = await api('games');
  pageMeta = META.games[LANG];
  return `<h1>${_('Games')} <span class="mut" style="font-size:15px">${esc(d.season)}</span></h1><div class="grid g2">${d.games.map(gameCard).join('') || `<div class="empty">${_('No games.')}</div>`}</div>`;
}

// ---------------------------------------------------------------- courts and lineups
// What a marker shows. The colour of a marker is always the player's rating tier; the number is the chosen metric.
const METRICS = {
  rating: ['Rating', v => Math.round(v)], pts: ['Points', v => v], reb: ['Rebounds', v => v], ast: ['Assists', v => v],
  stl: ['Steals', v => v], blk: ['Blocks', v => v], pir: ['PIR (efficiency)', v => v], min: ['Minutes', v => Math.round(v)],
  pm: ['Plus / minus', v => signed(Math.round(v))], fg_pct: ['FG %', v => Math.round(v)], p3_pct: ['3P %', v => Math.round(v)],
  ts_pct: ['True shooting %', v => Math.round(v)]
};
let metric = (localStorage.getItem('metric') in METRICS) ? localStorage.getItem('metric') : 'rating';
let courtData = null;   // what #court should draw: {kind:'team', lineup} or {kind:'game', g}

// Where the five roles stand on a half court whose basket is at the TOP (units: 0.1 ft, court 500 x 470).
const SPOT = { PG: [250, 332], SG: [420, 262], SF: [80, 262], PF: [336, 148], C: [184, 98] };
const shortName = n => { const t = title(n); return t.length > 16 ? t.slice(0, 15) + '…' : t; };

function halfLines(withBoundary) {
  return `<g fill="none" stroke="var(--court-line)" stroke-width="3" stroke-linecap="round">
    <rect x="170" y="0" width="160" height="190" fill="var(--court-paint)"/>
    <path d="M190 190 A60 60 0 0 0 310 190"/><path d="M190 190 A60 60 0 0 1 310 190" stroke-dasharray="7 7"/>
    <path d="M30 0 V142 A237.5 237.5 0 0 0 470 142 V0"/>
    <path d="M210 52.5 A40 40 0 0 0 290 52.5"/><path d="M220 40 H280"/>
    <circle cx="250" cy="52.5" r="9" stroke="var(--acc)" stroke-width="4"/>
    ${withBoundary ? '<rect x="0" y="0" width="500" height="470" rx="4"/><path d="M190 470 A60 60 0 0 1 310 470"/>' : ''}
  </g>`;
}

function marker(x, y, pl) {
  const v = METRICS[metric][1](pl[metric] ?? 0), big = String(v).length > 3;
  return `<g class="pl" data-go="${playerUrl(pl.id, pl.name)}" transform="translate(${x} ${y})"><title>${esc(title(pl.name))} · ${esc(posName(pl.pos))} · ${_('Rating')} ${pl.rating}</title>
    <text y="-39" text-anchor="middle" font-size="17" font-weight="700" fill="var(--mut)" stroke="var(--court)" stroke-width="4">${esc(posName(pl.spot || pl.pos))}</text>
    <circle class="dot" r="30" fill="${rcol(pl.rating)}" stroke="var(--court-line)" stroke-width="3"/>
    <text y="9" text-anchor="middle" font-size="${big ? 21 : 27}" font-weight="800" fill="#10131c">${v}</text>
    <text y="57" text-anchor="middle" font-size="19" font-weight="700" fill="var(--txt)" stroke="var(--court)" stroke-width="4">${esc(shortName(pl.name))}</text>
    <text y="77" text-anchor="middle" font-size="15" fill="var(--mut)" stroke="var(--court)" stroke-width="3">#${esc(pl.number)} · ${esc(posName(pl.pos))}</text></g>`;
}

function halfCourt(players) {   // one team around one basket
  return `<svg class="court half" viewBox="-8 -8 516 486" role="img" aria-label="${_('Starting five')}"><rect x="-8" y="-8" width="516" height="486" fill="var(--court-b)"/>
    <rect x="0" y="0" width="500" height="470" fill="var(--court)"/>${halfLines(true)}
    ${players.map(p => marker(...SPOT[p.spot], p)).join('')}</svg>`;
}

function fullCourt(left, right) {   // two teams, each around its own basket; centres under the baskets, guards towards the middle
  const toL = (x, y) => [y, 500 - x], toR = (x, y) => [940 - y, x];
  const put = (t, fn) => t.players.map(p => marker(...fn(...SPOT[p.spot]), p)).join('');
  const lg = (code, x) => `<image href="/img/teams/${esc(code)}.png" x="${x}" y="4" width="46" height="46"/>`;
  return `<svg class="court" viewBox="-8 -8 956 516" role="img" aria-label="${_('Starting five')}"><rect x="-8" y="-8" width="956" height="516" fill="var(--court-b)"/>
    <rect x="0" y="0" width="940" height="500" fill="var(--court)"/>
    <g transform="translate(0 500) rotate(-90)">${halfLines(false)}</g><g transform="translate(940 0) rotate(90)">${halfLines(false)}</g>
    <g fill="none" stroke="var(--court-line)" stroke-width="3"><rect x="0" y="0" width="940" height="500" rx="4"/><path d="M470 0 V500"/><circle cx="470" cy="250" r="60"/></g>
    ${lg(left.code, 14)}<text x="64" y="36" font-size="26" font-weight="800" fill="var(--txt)" stroke="var(--court)" stroke-width="5">${esc(left.code)}${left.score != null ? ' · ' + left.score : ''}</text>
    ${lg(right.code, 884)}<text x="876" y="36" text-anchor="end" font-size="26" font-weight="800" fill="var(--txt)" stroke="var(--court)" stroke-width="5">${right.score != null ? right.score + ' · ' : ''}${esc(right.code)}</text>
    ${put(left, toL)}${put(right, toR)}</svg>`;
}

const legend = () => `<div class="legend"><span>${_('Marker colour = rating:')}</span>${[[90, 'elite 90+'], [75, 'strong 75+'], [60, 'solid 60+'], [45, 'average 45+'], [0, 'below 45']].map(([r, l]) => `<span><i class="sw" style="background:${rcol(r)}"></i> ${_(l)}</span>`).join(' ')}</div>`;

function metricPicker() {
  return `<label class="mut small" for="metric">${_('Show')}</label><select id="metric">${Object.entries(METRICS).map(([k, [l]]) => `<option value="${k}" ${k === metric ? 'selected' : ''}>${_(l)}</option>`).join('')}</select>`;
}

function drawCourt() {
  const el = $('#court');
  if (!el || !courtData) return;
  if (courtData.kind === 'team') {
    el.innerHTML = halfCourt(courtData.lineup) + legend();
  } else {
    const g = courtData.g, [a, b] = g.teams, L = g.lineups;
    const A = { code: a.code, score: a.points, players: L[a.code].starters }, B = { code: b.code, score: b.points, players: L[b.code].starters };
    el.innerHTML = `<div class="court-wide">${fullCourt(A, B)}</div>
      <div class="court-narrow"><div class="tl"><span class="tn">${logo(a.code, 28)}${esc(a.name)}</span><span>${a.points}</span></div>${halfCourt(A.players)}
      <div class="tl"><span class="tn">${logo(b.code, 28)}${esc(b.name)}</span><span>${b.points}</span></div>${halfCourt(B.players)}</div>` + legend();
  }
  bind();
}

// ---------------------------------------------------------------- match page
async function game(id) {
  const g = await (await fetch('/api/games/' + encodeURIComponent(id))).json();
  if (!g.teams) throw new Error(_('Page not found'));
  const [a, b] = g.teams, L = g.lineups;

  pageMeta = [f('metaGame', a.name, a.points, b.points, b.name, md), `${a.name} ${a.points}–${b.points} ${b.name} · ${md}`];
  const frac = (m, t) => `${m}/${t}`;
  const sheet = t => {

    const sum = k => rows.reduce((s, r) => s + (r[k] || 0), 0);
    return `<h2><span class="tn">${logo(t.code, 28)}${esc(t.name)}</span> <span class="${t.won ? 'good' : 'mut'}">${t.points}</span> <span class="mut small" style="text-transform:none;letter-spacing:0">${_('full stat sheet')}</span></h2>

   ${rows.map(p => `<tr data-go="${playerUrl(p.id, p.name)}"><td>${esc(p.number)}</td><td class="l">${p.starter ? '<b>' : ''}${plink(p, esc(title(p.name)))}${p.starter ? '</b>' : ''}${g.mvp && g.mvp.player_id === p.id ? ' <span class="pill mvp">MVP</span>' : ''}</td><td class="mut">${esc(posName(p.pos))}</td>
     <td>${Math.round(p.min)}</td><td><b>${p.pts}</b></td><td>${p.reb}</td><td>${p.oreb}</td><td>${p.dreb}</td><td>${p.ast}</td><td>${p.stl}</td><td>${p.blk}</td><td>${p.tov}</td><td>${p.pf}</td><td>${p.fd}</td>
     <td>${frac(p.fgm, p.fga)}</td><td>${frac(p.p2m, p.p2a)}</td><td>${frac(p.p3m, p.p3a)}</td><td>${frac(p.ftm, p.fta)}</td><td>${signed(p.pm)}</td><td>${p.pir}</td><td>${rate(p.rating)}</td></tr>`).join('')}
   <tr class="tot"><td></td><td class="l">${_('Team')}</td><td></td><td>${Math.round(sum('min'))}</td><td>${sum('pts')}</td><td>${sum('reb')}</td><td>${sum('oreb')}</td><td>${sum('dreb')}</td><td>${sum('ast')}</td><td>${sum('stl')}</td><td>${sum('blk')}</td><td>${sum('tov')}</td><td>${sum('pf')}</td><td>${sum('fd')}</td>
     <td>${frac(sum('fgm'), sum('fga'))}</td><td>${frac(sum('p2m'), sum('p2a'))}</td><td>${frac(sum('p3m'), sum('p3a'))}</td><td>${frac(sum('ftm'), sum('fta'))}</td><td></td><td>${sum('pir')}</td><td></td></tr>
   ${l.dnp.map(p => `<tr class="mut"><td>${esc(p.number)}</td><td class="l">${esc(title(p.name))}</td><td colspan="19">${_('Did not play')}</td></tr>`).join('')}
   </tbody></table></div>`;
  };
  const bench = t => `<h2>${esc(f('benchOf', t.name))}</h2><div class="benchgrid">${L[t.code].bench.map(p => `<div class="bp" data-go="${playerUrl(p.id, p.name)}"><div class="n">${plink(p, esc(title(p.name)))}</div>

  <h2>${_('Starting five')}</h2>

async function team(codeArg) {
  const t = await api('teams/' + encodeURIComponent(codeArg)), st = t.standing, inPool = t.top_teams.includes(t.code);
  const played = t.results.length;
  courtData = t.lineup.length ? { kind: 'team', lineup: t.lineup } : null;
  pageMeta = [f('metaTeam', t.name, t.code), st ? `${t.name} · ${f('rankIn', st.rank)} · ${st.w}${W} ${st.l}${Ls}` : t.name];
  const dayRows = [...t.results].reverse().map(r => `<tr ${r.game_id ? `data-go="${gameUrl(r.game_id)}"` : 'style="cursor:default"'}><td class="l">J${r.matchday}</td>
    <td class="l"><span class="tn"><span class="mut small">${r.home ? _('vs') : '@'}</span>${logo(r.opp, 26)}${teamLink(r.opp, r.opp_name)}</span></td>
    <td><span class="pill ${r.won ? 'w' : 'l'}">${r.won ? W : Ls}</span></td><td><b>${r.pf} – ${r.pa}</b></td>
    <td class="mut small">${r.game_id ? `<a href="${gameUrl(r.game_id)}">${_('Match stats ›')}</a>` : _('No box score yet')}</td></tr>`).join('');
  return `<a class="mut" href="${url('standings')}">← ${_('Standings')}</a>
  <div class="card" style="margin-top:10px">
    <div class="row">${logo(t.code, 64)}<h1 style="margin:0">${esc(t.name)} <span class="mut" style="font-size:16px">${esc(t.code)}</span></h1><span class="sp"></span>
      <span class="pill">${_('Regular season')}</span></div>
    <div style="margin-top:8px">${st ? `<span class="pill">${esc(f('rankIn', st.rank))}</span> <span class="pill w">${st.w}${W}</span> <span class="pill l">${st.l}${Ls}</span> <span class="pill">${st.pts} ${_('Pts').toLowerCase()}</span> <span class="pill ${st.diff >= 0 ? 'w' : 'l'}">${signed(st.diff)}</span> ` : ''}${inPool ? `<span class="pill mvp">${_('MVP pool')}</span>` : ''}</div>
  </div>
  ${t.lineup.length ? `<h2>${_('Most-played five')}</h2>
  <div class="card"><div class="row" style="margin-bottom:10px">${metricPicker()}<span class="sp"></span><span class="mut small">${_('Season averages · click a player')}</span></div><div id="court"></div>
   <div class="note">${_('The five players with the most minutes this season, standing where their position puts them. Positions are inferred from stats (rebounds, blocks, assists, steals, threes) because the box scores do not list them; the admin can correct any player.')}</div></div>` : ''}
  <h2>${esc(f('history', played))}</h2>
  <div class="card scroll"><table><thead><tr><th>${_('Day')}</th><th class="l">${_('Opponent')}</th><th></th><th>${_('Score')}</th><th></th></tr></thead><tbody>
  ${dayRows || `<tr><td colspan="5" class="mut">${_('No matches played yet.')}</td></tr>`}
  </tbody></table></div>
  <h2>${_('Next matches · calendar')}</h2>
  ${t.projected ? `<div class="banner">${_('Projected calendar: the second phase is assumed to mirror the first (same order, home and away swapped). It will be replaced by the official dates when they are added.')}</div>` : ''}
  <div class="card scroll"><table><thead><tr><th>${_('Day')}</th><th class="l">${_('Opponent')}</th><th></th></tr></thead><tbody>
  ${t.upcoming.map(u => `<tr style="cursor:default"><td class="l">J${u.matchday}</td><td class="l"><span class="tn"><span class="mut small">${u.home ? _('vs') : '@'}</span>${logo(u.opp, 26)}${teamLink(u.opp, u.opp_name)}</span></td><td class="mut small">${u.home ? _('At home') : _('Away')}${t.projected ? ' · ' + _('projected') : ''}</td></tr>`).join('') || `<tr><td colspan="3" class="mut">${_('No upcoming matches.')}</td></tr>`}
  </tbody></table></div>
  <h2>${_('Players')}</h2>
  <div class="card scroll"><table><thead><tr><th class="l">${_('Player')}</th><th>${H('POS')}</th><th>${H('GP')}</th><th>MIN</th><th>PTS</th><th>REB</th><th>${H('AST')}</th><th>PIR</th><th>${H('RTG')}</th></tr></thead><tbody>
  ${t.players.map(p => `<tr data-go="${playerUrl(p.id, p.name)}"><td class="l">${plink(p)}${p.mvp_games ? ` <span class="pill mvp">${f('mvpTag', p.mvp_games)}</span>` : ''}</td><td class="mut">${esc(posName(p.pos))}</td><td>${p.gp}</td><td>${p.min}</td><td>${p.pts}</td><td>${p.reb}</td><td>${p.ast}</td><td>${p.pir}</td><td>${rate(p.rating)}</td></tr>`).join('') || `<tr><td colspan="9" class="mut">${_('No player stats yet.')}</td></tr>`}
  </tbody></table></div>`;
}

let planTeam = '';
async function planning() {
  const d = await (await fetch('/api/planning')).json();
  pageMeta = META.planning[LANG];
  const codes = Object.keys(d.teams).sort((a, b) => d.teams[a].localeCompare(d.teams[b]));
  const head = `<h1>${_('Planning')} <span class="mut" style="font-size:15px">${esc(f('planningSub', d.matchdays[0]?.matchday, d.matchdays.at(-1)?.matchday))}</span></h1>
  ${d.projected ? `<div class="banner">${_('Projected calendar: the second phase is assumed to mirror the first (same order, home and away swapped). It will be replaced by the official dates when they are added.')}</div>` : ''}
  <div class="row" style="margin-bottom:12px"><label class="mut small" for="pt">${_('Show one team')}</label>
    <select id="pt"><option value="">${_('All teams')}</option>${codes.map(c => `<option value="${c}" ${c === planTeam ? 'selected' : ''}>${esc(d.teams[c])}</option>`).join('')}</select></div>`;
  if (planTeam) {   // only this team's matches, one line per matchday
    const rows = d.matchdays.map(m => {
      const g = m.games.find(x => x.home === planTeam || x.away === planTeam);
      if (!g) return '';
      const home = g.home === planTeam, opp = home ? g.away : g.home;
      const res = g.played ? `<b>${home ? g.home_score : g.away_score} – ${home ? g.away_score : g.home_score}</b>` : '';
      return `<tr style="cursor:default"><td class="l">J${m.matchday}</td><td class="l"><span class="tn"><span class="mut small">${home ? _('vs') : '@'}</span>${logo(opp, 26)}${teamLink(opp, d.teams[opp])}</span></td>
        <td class="mut small">${home ? _('At home') : _('Away')}${d.projected && !g.played ? ' · ' + _('projected') : ''}</td><td>${res}</td></tr>`;
    }).join('');
    return head + `<div class="card"><div class="row" style="margin-bottom:6px"><span class="tn" style="font-size:18px;font-weight:800">${logo(planTeam, 40)}${esc(d.teams[planTeam])}</span><span class="sp"></span>
      <a href="${teamUrl(planTeam)}" class="mut small">${_('Team page')} ›</a></div>
      <div class="scroll"><table><thead><tr><th>${_('Day')}</th><th class="l">${_('Opponent')}</th><th></th><th>${_('Score')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  return head + `<div class="grid g2">${d.matchdays.map(m => `<div class="card"><div class="row"><b>J${m.matchday}</b><span class="sp"></span><span class="mut small">${d.projected ? _('projected') : ''}</span></div>
    ${m.games.map(g => `<div class="match" style="padding:6px 0;border-top:1px solid var(--line)">
      <a class="tn" href="${teamUrl(g.home)}">${logo(g.home, 22)}${esc(g.home)}</a>
      ${g.played ? `<b>${g.home_score} – ${g.away_score}</b>` : `<span class="mut small">${_('vs')}</span>`}
      <a class="tn" href="${teamUrl(g.away)}">${esc(g.away)}${logo(g.away, 22)}</a></div>`).join('')}</div>`).join('')}</div>`;
}

// ---------------------------------------------------------------- wiring
function bind() {
  document.querySelectorAll('[data-go]').forEach(el => el.onclick = e => { if (e.target.closest('a')) return; go(el.dataset.go); });
  document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => { const k = th.dataset.sort; sortDir = sortKey === k ? -sortDir : -1; sortKey = k; route(true); });
  const qi = $('#q'); if (qi) { qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; route(true).then(() => { const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); }); }; }
  document.querySelectorAll('[data-lead]').forEach(c => c.onclick = e => { if (!e.target.closest('a')) openLeaders(c.dataset.lead); });
  const ql = $('#qual'); if (ql) { ql.onclick = () => { qualOnly = !qualOnly; route(true); }; ql.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ql.click(); } }; }
  const tf = $('#tf'); if (tf) tf.onchange = () => { teamF = tf.value; route(true); };
  const pt = $('#pt'); if (pt) pt.onchange = () => { planTeam = pt.value; route(true); };
  const mt = $('#metric'); if (mt) mt.onchange = () => { metric = mt.value; localStorage.setItem('metric', metric); drawCourt(); };
}

// links inside the site move between pages without reloading
document.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target || a.origin !== location.origin) return;
  if (!parsePath(a.pathname)) return;
  e.preventDefault();
  go(a.pathname);
});
addEventListener('popstate', () => route());

// old bookmarks like /#/team/CA -> /team/CA
if (location.hash.startsWith('#/')) {
  const [, pg, arg] = location.hash.split('/');
  const page = { teams: 'standings', '': 'home' }[pg] ?? pg;
  if (SLUG.en[page] || page === 'home') history.replaceState(null, '', url(page, arg));
}
// a visitor who chose English earlier goes straight to the English home page (deep links and search engines are never redirected)
if (location.pathname === '/' && localStorage.getItem('lang') === 'en') location.replace('/en/');

$('#theme').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
$('#theme').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('#lang').value = LANG;
$('#lang').onchange = e => { localStorage.setItem('lang', e.target.value); const r = parsePath(location.pathname) || { page: 'home' }; location.href = url(r.page, r.arg, e.target.value); };
$('#season').onchange = e => { season = e.target.value; localStorage.setItem('season', season); route(true); };
fetch('/admin/api/me', { credentials: 'same-origin' }).then(r => r.json()).then(m => { $('#syncbtn').hidden = !m.admin; }).catch(() => {});  // Sync is for the admin only
$('#syncbtn').onclick = async () => {
  const b = $('#syncbtn'); b.textContent = '⟳ ' + _('Syncing…');
  const r = await fetch('/api/sync', { method: 'POST', credentials: 'same-origin' });
  if (!r.ok) { b.textContent = '⟳ ' + _('Sync'); alert(_('Admin login required: open /admin and log in first.')); return; }
  for (let i = 0; i < 120; i++) { await new Promise(r => setTimeout(r, 3000)); const s = await (await fetch('/api/status', { credentials: 'same-origin' })).json(); if (!s.running) break; }
  b.textContent = '⟳ ' + _('Sync'); route(true);
};
(async () => {  // fill the season picker on every page
  const d = await api('overview');
  $('#season').innerHTML = d.seasons.map(x => `<option ${x === d.season ? 'selected' : ''}>${x}</option>`).join('');
})();
route(true);
// auto-refresh data every 2 minutes so new games appear without reloading
setInterval(() => { if (!document.hidden && !document.activeElement.matches('input')) route(true); }, 120000);

$('#phase').title = _('Current competition phase'); $('#theme').title = _('Switch between dark and light mode'); $('#theme').setAttribute('aria-label', _('Switch between dark and light mode'));
$('#syncbtn').title = _('Check Google Drive for new box scores now'); $('#syncbtn').textContent = '⟳ ' + _('Sync'); $('#lang').title = _('Language');
</script>
</body>
</html>
