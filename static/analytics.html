<head>

<title>Live stats · Tunisia Basket</title>
<style>
  :root { --bg:#0f1426; --panel:#1a2140; --panel2:#222b50; --text:#eef1fa; --muted:#8e99bd; --accent:#ff8a1f; --good:#1fa654; --bad:#d94452; --line:#2d3760; }
  * { box-sizing:border-box; }

  .tagbar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:8px; background:#3a2a0a; border-left:4px solid var(--accent); border-radius:10px; padding:6px 10px; font-size:13px; }
  .tagbar .tg { padding:8px 12px; border-radius:99px; background:var(--panel2); font-weight:700; } .tagbar .tg.on { background:var(--accent); color:#1a1205; } .tagbar .tgx { margin-left:auto; background:transparent; color:var(--muted); }
  .startcard { background:var(--panel); border:1px solid var(--accent); border-radius:12px; padding:12px 14px; margin-bottom:14px; display:grid; gap:8px; }
  .startcard .sf { display:flex; gap:6px; align-items:center; flex-wrap:wrap; } .startcard .sf b { min-width:90px; } .startcard .ch { display:inline-flex; gap:5px; align-items:center; background:var(--panel2); border-radius:99px; padding:3px 10px 3px 4px; font-size:13px; }
  .startcard .ch .av { width:22px; height:22px; font-size:10px; } .startcard .accent { padding:12px; font-size:16px; }
  .team .th { display:flex; align-items:baseline; gap:10px; } .team .th h3 { margin:0; font-size:17px; } .team .th .ts { font-size:24px; font-weight:800; margin-left:auto; font-variant-numeric:tabular-nums; }
  .xl { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 8px; } .xl span { background:var(--panel); border-radius:99px; padding:2px 10px; font-size:12px; color:var(--muted); } .xl b { color:var(--text); }
  .sec { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:8px 0 5px; }
  .benchd { margin-top:10px; } .benchd > summary { cursor:pointer; color:var(--muted); padding:6px 0; font-weight:600; } .benchd[open] > summary { margin-bottom:6px; }
  .p .nm { width:auto; flex:1 1 150px; min-width:120px; } .p .nm .n1 { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; } .p .nm .cl { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p.sel { outline:2px solid var(--accent); background:#2a2f55; } .p .cd { width:32px; height:32px; font-size:15px; } .p .cd.bench { background:var(--panel2); } .p .btns { margin-left:auto; }
  .tabs2 { display:none; }
  #pad { display:none; }
  .tgs { display:inline-flex; gap:4px; } .tgs button { padding:4px 8px; font-size:12px; background:var(--panel2); } .tgs button.on { background:var(--accent); color:#1a1205; }
  .tagtxt { color:#ffcf8a; font-size:12px; }
  @media (max-width:899px) {
    header { position:static; padding:8px 12px; } header h1 { font-size:16px; } header .muted:not(#who) { display:none; }

<body>
<header>
  <h1>LIVE STATS</h1>
  <span class="muted">Tunisia Basket · analytics</span>
  <span class="sp"></span>
  <span id="who" class="muted"></span>
  <button id="logout" hidden>Sign out</button>
</header>
<main id="app"></main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const BTNS = [
  ["ft_m", "+1", "mk", "Free throw made"], ["p2_m", "+2", "mk", "2-pointer made"], ["p3_m", "+3", "mk", "3-pointer made"], null,
  ["ft_x", "✗1", "ms", "Free throw missed"], ["p2_x", "✗2", "ms", "2-pointer missed"], ["p3_x", "✗3", "ms", "3-pointer missed"], null,
  ["oreb", "OR", "ot", "Offensive rebound"], ["dreb", "DR", "ot", "Defensive rebound"], ["ast", "AST", "ot", "Assist"], ["stl", "STL", "ot", "Steal"],
  ["blk", "BLK", "ot", "Block"], ["tov", "TOV", "ot", "Turnover"], ["pf", "PF", "ot", "Personal foul"], ["fd", "FD", "ot", "Foul drawn (a foul against him)"],
  ["tf", "T", "ev", "Technical foul (counts as one of his fouls)"], ["inj", "🤕", "ev", "Injured (leaves the game)"], ["ej", "EJ", "ev", "Ejected (disqualified)"],
];
// the team's own actions (the sheet's "Team / Coach" row, the timeouts): not a player's
const TEAMB = [["t_oreb", "T-OR", "tb", "Team offensive rebound"], ["t_dreb", "T-DR", "tb", "Team defensive rebound"], ["t_tov", "T-TO", "to", "Team turnover"], ["timeout", "⏱", "tt", "Timeout"], ["tf_c", "T·C", "tt", "Technical foul on the coach"], ["tf_b", "T·B", "tt", "Technical foul on the bench"]];
const DEAD = new Set(["ft_m", "ft_x", "tf", "inj", "ej", "timeout", "tf_c", "tf_b"]);       // the ball is dead: the clock does not start by itself after these (a free throw, a technical, a timeout, an injury...)
const LABEL = Object.fromEntries([...BTNS, ...TEAMB].filter(Boolean).map(b => [b[0], b[3]]));
const STATE = { open: "Counting", submitted: "Waiting for approval", published: "Approved: on the site", rejected: "Sent back" };
let S = { data: null, game: null };

async function api(path, method = "GET", body) {
  const r = await fetch("/analytics/api" + path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && path !== "/login") { S.data = null; showLogin(); throw new Error("Please sign in."); }
  if (!r.ok) { toast(j.error || r.statusText); throw new Error(j.error || r.statusText); }
  return j;
}

$("#logout").onclick = async () => { await fetch("/analytics/api/logout", { method: "POST" }); location.hash = ""; showLogin(); };

async function load() {
  const me = await (await fetch("/analytics/api/me")).json();

  S.me = me; $("#logout").hidden = !!me.admin && !me.name; $("#who").textContent = me.name ? (me.admin ? "Admin" : "Counting as " + me.name) : "";

async function start(body) { const g = await api("/games", "POST", body); open(g.id); }
function open(id) { location.hash = "#game=" + id; load(); }

/* ---- game ---- */
const ptsOf = r => (r?.ft_m || 0) + 2 * (r?.p2_m || 0) + 3 * (r?.p3_m || 0);
function tally(game) { const t = {}; game.events.forEach(e => { if (e.stat === "lineup" || e.pid == null) return; const r = (t[e.pid] ||= {}); r[e.stat] = (r[e.stat] || 0) + 1; }); return t; }
const editable = g => g.status === "open" || g.status === "rejected" || (S.me?.admin && g.status === "submitted");        // the admin may also correct a version waiting for approval
const isMobile = () => matchMedia("(max-width: 899px)").matches;
const TAGS = { p2_m: ["paint", "second", "fast", "tov"], p3_m: ["second", "fast", "tov"], ft_m: ["second", "fast", "tov"] };
const TAGN = { paint: "Paint", second: "2nd chance", fast: "Fast break", tov: "Off turnover" };
S.bench = {};
function countsLine(r) {
  const g = k => r[k] || 0, fg = g("p2_m") + g("p3_m"), fga = fg + g("p2_x") + g("p3_x"), ft = g("ft_m"), fta = ft + g("ft_x"), reb = g("oreb") + g("dreb"), p = [];
  if (fga) p.push(`FG ${fg}/${fga}`);
  if (g("p3_m") || g("p3_x")) p.push(`3P ${g("p3_m")}/${g("p3_m") + g("p3_x")}`);
  if (fta) p.push(`FT ${ft}/${fta}`);
  if (reb) p.push(`R ${reb}`);
  [["ast", "A"], ["stl", "S"], ["blk", "B"], ["tov", "TO"], ["fd", "FD"]].forEach(([k, l]) => { if (g(k)) p.push(`${l} ${g(k)}`); });
  if (g("pf") + g("tf")) p.push(`PF ${g("pf") + g("tf")}`);                  // a technical foul is one of his fouls
  if (g("tf")) p.push(`T ${g("tf")}`);
  return p.join(" · ") || "nothing yet";
}
// the team's own row: team rebounds and turnovers (the sheet's "Team / Coach" row), a timeout, a technical foul on the coach or the bench, and the team totals so far
function teamRow(code, ed) {
  const g = S.game, te = (g.team_events || {})[code] || {}, tt = (g.totals || {})[code] || {}, n = k => tt[k] || 0;
  const btns = TEAMB.map(b => `<button class="b ${b[2]}" data-tstat="${b[0]}" data-tteam="${code}" title="${b[3]}" ${ed ? "" : "disabled"}>${b[1]}${te[b[0]] ? `<i>${te[b[0]]}</i>` : ""}</button>`).join("");
  const line = `PTS <b>${n("pts")}</b> · FG <b>${n("fgm")}/${n("fga")}</b> · 3P <b>${n("p3m")}/${n("p3a")}</b> · FT <b>${n("ftm")}/${n("fta")}</b> · REB <b>${n("reb")}</b>${n("team_reb") ? ` (team ${n("team_reb")})` : ""} · AST <b>${n("ast")}</b> · STL <b>${n("stl")}</b> · BLK <b>${n("blk")}</b> · TO <b>${n("tov")}</b>${n("team_tov") ? ` (team ${n("team_tov")})` : ""} · PF <b>${n("pf")}</b> · Timeouts <b>${n("timeouts")}</b> · Technicals <b>${n("techs")}</b>`;
  return `<div class="trow" title="Counted for the team, not for a player"><b>Team</b>${btns}</div><div class="ttot">${line}</div>`;
}
async function addTeam(code, stat) {
  const y = scrollY, c = clk();
  if (stat === "timeout") clkStop(c);                                               // the clock stops during a timeout
  const at = !DEAD.has(stat) && c.auto && !c.running && c.left > 0 ? (clkStart(c), clkNow(c)) : clkNow(c);
  S.game = await api(`/games/${S.game.id}/team`, "POST", { team: code, stat, q: c.q, t: at });
  renderGame(); scrollTo(0, y);
}
function suggestFive(code) {       // the server's guess (starts this season and in the last games); filled up with the most-used players if it has fewer than five
  const g = S.game, ids = new Set(g.players[code].map(p => p.id));
  const five = ((S.data.fives || {})[code] || []).filter(i => ids.has(i)).slice(0, 5);
  for (const p of g.players[code]) { if (five.length >= 5) break; if (!five.includes(p.id)) five.push(p.id); }
  return five;
}
async function startFives(codes) {

  S.game = await api(`/games/${S.game.id}`); renderGame();
}

addEventListener("resize", (() => { let m = isMobile(); return () => { if (m !== isMobile()) { m = isMobile(); if (S.game) renderGame(); } }; })());
addEventListener("hashchange", load);
load();
</script>
