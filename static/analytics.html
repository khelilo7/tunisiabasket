<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Live stats · Tunisia Basket</title>
<style>
  :root { --bg:#0f1426; --panel:#1a2140; --panel2:#222b50; --text:#eef1fa; --muted:#8e99bd; --accent:#ff8a1f; --good:#1fa654; --bad:#d94452; --line:#2d3760; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.35 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; border-radius:8px; background:var(--panel2); padding:8px 12px; }
  button:hover { filter:brightness(1.25); } button:disabled { opacity:.4; cursor:default; filter:none; }
  select, input { font:inherit; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; }
  a { color:inherit; text-decoration:none; }
  header { display:flex; align-items:center; gap:14px; padding:12px 20px; background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; color:var(--accent); letter-spacing:.5px; }
  .sp { flex:1; } .muted { color:var(--muted); font-size:13px; }
  main { padding:20px; max-width:1500px; margin:0 auto; }
  h2 { font-size:15px; margin:26px 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .matches { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; }
  .match { text-align:left; padding:14px; background:var(--panel); border:1px solid var(--line); }
  .match b { font-size:17px; } .match.has { border-color:var(--accent); }
  details { margin-top:10px; } summary { cursor:pointer; color:var(--muted); padding:6px 0; }
  .row-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .saved { display:flex; gap:10px; align-items:center; padding:10px 14px; background:var(--panel); border-radius:10px; margin-bottom:8px; flex-wrap:wrap; }
  .accent { background:var(--accent); color:#1a1205; font-weight:700; }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; background:var(--panel2); color:var(--muted); }
  .pill.submitted { background:#5a4a12; color:#ffd66b; } .pill.published { background:#17492c; color:#7be0a3; } .pill.rejected { background:#55222b; color:#ff9aa5; }
  .login { max-width:380px; margin:12vh auto; background:var(--panel); padding:26px; border-radius:14px; }
  .login input { width:100%; margin:12px 0; letter-spacing:2px; text-transform:uppercase; }
  .bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .score { flex:1; text-align:center; font-size:30px; font-weight:800; }
  .score small { display:block; font-size:12px; font-weight:500; color:var(--muted); }
  .teams { display:grid; grid-template-columns:1fr; gap:18px; margin-top:16px; }
  @media (min-width:1250px) { .teams { grid-template-columns:1fr 1fr; } }
  .team h3 { margin:0 0 8px; font-size:16px; }
  .p { display:flex; align-items:center; gap:6px; background:var(--panel); border-radius:10px; padding:5px 8px; margin-bottom:5px; }
  .av { width:28px; height:28px; border-radius:50%; background:var(--panel2) center/cover; flex:none; display:grid; place-items:center; font-weight:700; font-size:12px; color:var(--muted); }
  .nm { width:112px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .nm small { color:var(--muted); font-weight:400; }
  .pts { width:28px; text-align:right; font-size:19px; font-weight:800; flex:none; }
  .pts.flash { color:var(--accent); }
  .btns { display:flex; gap:2px; flex-wrap:wrap; margin-left:6px; }
  .b { position:relative; min-width:32px; padding:8px 2px; font-weight:700; font-size:13px; border-radius:7px; user-select:none; }
  .b.mk { background:#17492c; } .b.mk:hover { background:#1b6a3a; filter:none; }
  .b.ms { background:#55222b; } .b.ms:hover { background:#7b2a37; filter:none; }
  .b.ot { background:var(--panel2); min-width:34px; font-size:12px; }
  .b i { position:absolute; top:-6px; right:-4px; min-width:16px; padding:0 4px; font-style:normal; font-size:11px; line-height:16px; border-radius:8px; background:var(--accent); color:#1a1205; }
  .b:active { transform:scale(.92); }
  .sep { width:4px; flex:none; }
  .legend { margin-top:14px; }
  .log div { display:flex; gap:10px; align-items:center; padding:4px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .log button { padding:2px 8px; background:transparent; color:var(--muted); }
  .note { background:var(--panel); border-left:4px solid var(--accent); padding:10px 14px; border-radius:8px; margin-top:14px; }
  .clock { display:flex; align-items:center; gap:8px; background:var(--panel); padding:6px 10px; border-radius:10px; }
  .clock .t { font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; min-width:68px; text-align:center; cursor:pointer; }
  .clock .t.run { color:var(--good); } .clock label { font-size:12px; color:var(--muted); display:flex; gap:4px; align-items:center; }
  .p.on { box-shadow:inset 4px 0 0 var(--good); } .p.pick { cursor:pointer; } .p.picked { background:#173d2a; }
  .cd { width:26px; height:26px; padding:0; border-radius:50%; flex:none; font-size:13px; line-height:1; background:var(--panel2); color:var(--muted); }
  .cd.on { background:var(--good); color:#fff; } .cd.pk { background:transparent; border:2px solid var(--muted); } .cd.pk.picked { background:var(--accent); border-color:var(--accent); color:#1a1205; font-weight:800; }
  .mn { width:44px; text-align:right; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; flex:none; line-height:1.15; } .mn b { display:block; color:var(--text); font-size:13px; } .mn .pos { color:#7be0a3; } .mn .neg { color:#ff9aa5; }
  .courtbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 10px; padding:8px; background:var(--panel); border-radius:10px; }
  .courtbar .ch { display:flex; gap:6px; align-items:center; background:var(--panel2); border-radius:99px; padding:3px 10px 3px 4px; font-size:13px; } .courtbar .ch .av { width:22px; height:22px; font-size:10px; }
  .courtbar .ch small { color:var(--muted); }
  .courtbar .hint { color:var(--muted); font-size:13px; }
  .pickbar { background:#173d2a; } .pickbar b { color:#7be0a3; }
  #subm { position:fixed; inset:0; background:rgba(5,8,18,.6); display:grid; place-items:center; z-index:8; } #subm > div { background:var(--panel); border-radius:14px; padding:16px; width:min(380px, 92vw); max-height:84vh; overflow:auto; }
  #subm h4 { margin:0 0 10px; font-size:15px; } #subm button.o { display:flex; gap:8px; width:100%; margin-bottom:6px; align-items:center; text-align:left; } #subm button.o small { color:var(--muted); margin-left:auto; }
  .vlist { margin:6px 0 4px; background:var(--panel); border-radius:10px; padding:4px 12px 10px; } .vlist > summary { padding:10px 0; font-weight:600; } .vlist .saved { background:var(--bg); }
  #who { font-size:13px; } .name-note { color:var(--muted); font-size:13px; margin:-4px 0 8px; }
  .other { background:#3a2a0a; border-left-color:#ffb020; }
  .hist { margin-top:26px; } .hist .hbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; } .hist .hbar input { flex:1; min-width:180px; }
  .hform { display:flex; gap:6px; flex-wrap:wrap; align-items:center; background:var(--panel); padding:8px; border-radius:10px; margin-bottom:8px; } .hform select, .hform input { padding:6px; }
  .hlist { max-height:520px; overflow:auto; border:1px solid var(--line); border-radius:10px; } .hlist[hidden] { display:none; }
  .hrow { display:grid; grid-template-columns:78px 92px 1fr auto; gap:8px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); font-size:13px; } .hrow:last-child { border-bottom:0; } .hrow:hover { background:var(--panel); }
  .hrow .tm { color:var(--muted); font-variant-numeric:tabular-nums; } .hrow .by { color:var(--accent); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hrow .ed { color:var(--muted); font-size:11px; }
  .hrow .ba { display:flex; gap:4px; } .hrow .ba button { padding:3px 8px; background:transparent; color:var(--muted); } .hrow .ba button:hover { color:var(--text); }
  .hrow.editing { grid-template-columns:1fr; background:#173d2a; } .hrow.editing .hform { background:transparent; margin:0; padding:0; }
  .clog { margin-top:10px; } .clog .ln { display:grid; grid-template-columns:140px 90px 1fr; gap:8px; font-size:12px; padding:3px 0; border-bottom:1px solid var(--line); } .clog .ln span:first-child { color:var(--muted); }
  @media (max-width:700px) { .hrow { grid-template-columns:62px 1fr auto; } .hrow .by { display:none; } }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--bad); padding:10px 16px; border-radius:10px; z-index:9; }
  .toast.ok { background:var(--good); }
</style>
</head>
<body>
<header>
  <h1>LIVE STATS</h1>
  <span class="muted">Tunisia Basket · analytics</span>
  <span class="sp"></span>
  <span id="who" class="muted"></span>
  <button id="logout" hidden>Sign out</button>
</header>
<main id="app"></main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const BTNS = [
  ["ft_m", "+1", "mk", "Free throw made"], ["p2_m", "+2", "mk", "2-pointer made"], ["p3_m", "+3", "mk", "3-pointer made"], null,
  ["ft_x", "✗1", "ms", "Free throw missed"], ["p2_x", "✗2", "ms", "2-pointer missed"], ["p3_x", "✗3", "ms", "3-pointer missed"], null,
  ["oreb", "OR", "ot", "Offensive rebound"], ["dreb", "DR", "ot", "Defensive rebound"], ["ast", "AST", "ot", "Assist"], ["stl", "STL", "ot", "Steal"],
  ["blk", "BLK", "ot", "Block"], ["tov", "TOV", "ot", "Turnover"], ["pf", "PF", "ot", "Personal foul"],
];
const LABEL = Object.fromEntries(BTNS.filter(Boolean).map(b => [b[0], b[3]]));
const STATE = { open: "Counting", submitted: "Waiting for approval", published: "Approved: on the site", rejected: "Sent back" };
let S = { data: null, game: null };

async function api(path, method = "GET", body) {
  const r = await fetch("/analytics/api" + path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && path !== "/login") { S.data = null; showLogin(); throw new Error("Please sign in."); }
  if (!r.ok) { toast(j.error || r.statusText); throw new Error(j.error || r.statusText); }
  return j;
}
function toast(msg, ok) { const t = document.createElement("div"); t.className = "toast" + (ok ? " ok" : ""); t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 4000); }
const tn = c => (S.data?.teams || {})[c] || c;

function showLogin(err) {
  $("#logout").hidden = true; $("#who").textContent = "";
  let saved = ""; try { saved = localStorage.getItem("an-name") || ""; } catch {}
  $("#app").innerHTML = `<form class="login" id="lf"><h2 style="margin:0">Sign in</h2><p class="muted">Your name, then the analytics token you were given.</p>
    <input id="nm" autocomplete="off" maxlength="30" placeholder="Your name (compulsory)" value="${esc(saved)}" style="text-transform:none;letter-spacing:0" ${saved ? "" : "autofocus"}>
    <p class="name-note">Every action you make is stamped with this name. Two analysts with two names each get their own sheet of a game.</p>
    <input id="tok" autocomplete="off" ${saved ? "autofocus" : ""} placeholder="XXXX-XXXX-XXXX-XXXX"><button class="accent" style="width:100%">Sign in</button><p class="muted" id="err">${esc(err || "")}</p></form>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const name = $("#nm").value.trim();
    if (name.length < 2) { $("#err").textContent = "Enter your name (at least 2 letters)."; return $("#nm").focus(); }
    const r = await fetch("/analytics/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: $("#tok").value, name }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { try { localStorage.setItem("an-name", name); } catch {} load(); } else $("#err").textContent = j.error || "Could not sign in.";
  };
}
$("#logout").onclick = async () => { await fetch("/analytics/api/logout", { method: "POST" }); location.hash = ""; showLogin(); };

async function load() {
  const me = await (await fetch("/analytics/api/me")).json();
  if (!me.analyst) return showLogin(me.configured ? "" : "No analytics token has been set yet.");
  S.me = me; $("#logout").hidden = !!me.admin && !me.name; $("#who").textContent = me.name ? (me.admin ? "Admin" : "Counting as " + me.name) : "";
  S.data = await api("/data");
  const id = location.hash.startsWith("#game=") ? location.hash.slice(6) : null;
  S.game = null;
  if (id) { try { S.game = await api("/games/" + id); } catch { location.hash = ""; } }
  S.game ? renderGame() : renderHome();
}

/* ---- home ---- */
function renderHome() {
  const D = S.data, app = $("#app");
  const mine = D.games.filter(g => !g.analyst || g.analyst === S.me.name).sort((a, b) => (a.analyst ? 1 : 0) - (b.analyst ? 1 : 0)), byId = Object.fromEntries(mine.map(g => [g.base, g]));     // an old game without a name is continued as it is; a version of mine wins over it      // "Continue" is about my own version
  const days = [...new Set(D.matches.map(m => m.matchday))].sort((a, b) => a - b);
  const next = days.find(d => D.matches.some(m => m.matchday === d && !m.played)) ?? days[0];
  const order = [next, ...days.filter(d => d > next).slice(0, 2)];
  const card = m => {
    const g = byId[`j${m.matchday}-${m.home.toLowerCase()}-${m.away.toLowerCase()}`];
    return `<button class="match ${g ? "has" : ""}" data-md="${m.matchday}" data-home="${m.home}" data-away="${m.away}" data-date="${m.date || ""}">
      <b>${esc(tn(m.home))}</b> <span class="muted">vs</span> <b>${esc(tn(m.away))}</b><br><span class="muted">${esc([m.date, m.time].filter(Boolean).join(" · "))}</span>
      ${g ? `<br><span style="color:var(--accent)">▶ Continue · ${g.home_score} – ${g.away_score}</span>` : ""}</button>`;
  };
  const vidMine = Object.fromEntries(mine.filter(g => g.kind === "video").map(g => [g.base, g]));
  const vrow = v => {
    const g = vidMine[v.base], two = (v.recorded_all || []).length > 1, why = v.status === "none" ? "No box score" : two ? "Partial: both teams counted, some players missing" : v.complete ? `Partial: only ${tn(v.recorded)} was recorded` : `Partial: some of ${tn(v.recorded)}'s players`;
    return `<div class="saved"><b>${esc(tn(v.home))} ${v.home_score} – ${v.away_score} ${esc(tn(v.away))}</b><span class="muted">J${v.matchday}</span><span class="pill ${v.status === "none" ? "rejected" : "submitted"}">${why}</span><span class="sp"></span>
      ${g ? `<button data-open="${g.id}" title="It is on your board: open it">✔ On your board · open</button>` : `<button class="accent" data-vadd="${v.matchday}|${v.home}|${v.away}|${v.date || ""}">＋ Add to my board</button>`}</div>`;
  };
  const todo = (D.video || []).length ? `<details class="vlist" ${S.vopen ? "open" : ""}><summary>🎥 Games without a full box score <span class="muted">(${D.video.length}): add the ones you want to count from the video to your board</span></summary>${D.video.map(vrow).join("")}</details>` : "";
  const gameRow = g => `<div class="saved"><b>${esc(tn(g.home))} ${g.home_score} – ${g.away_score} ${esc(tn(g.away))}</b>
      <span class="pill ${g.status}">${STATE[g.status]}</span>${g.matchday ? `<span class="muted">J${g.matchday}</span>` : ""}${g.analyst ? `<span class="pill" title="the analyst who counted this version">✎ ${esc(g.analyst)}</span>` : ""}<span class="muted">${esc(g.created)} · ${g.events} actions</span><span class="sp"></span>
      <button data-open="${g.id}">Open</button><a href="/analytics/api/games/${g.id}/export.csv"><button>CSV</button></a>${g.status === "published" ? "" : `<button data-del="${g.id}">Delete</button>`}</div>`;
  const curGames = D.games.filter(g => g.kind !== "video"), vidGames = D.games.filter(g => g.kind === "video"), who = S.me.admin ? "every version" : "yours";
  const opts = Object.keys(D.roster).sort((a, b) => tn(a).localeCompare(tn(b))).map(c => `<option value="${c}">${esc(tn(c))}</option>`).join("");
  app.innerHTML = `
    ${order.map((d, i) => `${i ? `<details><summary>Matchday ${d}</summary>` : `<h2>Matchday ${d}</h2>`}<div class="matches">${D.matches.filter(m => m.matchday === d).map(card).join("")}</div>${i ? "</details>" : ""}`).join("")}
    <h2>Any other game</h2>
    <div class="row-actions"><select id="h">${opts}</select> <span class="muted">vs</span> <select id="a">${opts}</select><button class="accent" id="go">Start</button></div>
    <h2>🎥 From video</h2>${todo}
    ${vidGames.length ? `<h2>Your games · from video <span class="muted" style="font-size:13px;font-weight:400">${who}</span></h2>${vidGames.map(gameRow).join("")}` : `<p class="muted">Nothing added from the video list yet.</p>`}
    ${curGames.length ? `<h2>Your games · current <span class="muted" style="font-size:13px;font-weight:400">${who}</span></h2>${curGames.map(gameRow).join("")}` : ""}`;
  $("#a").selectedIndex = 1;
  const vd = app.querySelector("details.vlist"); if (vd) vd.ontoggle = () => { S.vopen = vd.open; };
  app.querySelectorAll("[data-vadd]").forEach(b => b.onclick = async () => {
    const [md, home, away, date] = b.dataset.vadd.split("|");
    b.disabled = true; S.vopen = true;
    try { await api("/games", "POST", { home, away, matchday: +md, date, video: true }); toast("Added to your board.", true); } catch { b.disabled = false; return; }
    load();
  });
  app.querySelectorAll(".match").forEach(b => b.onclick = () => { const ex = byId[`j${b.dataset.md}-${b.dataset.home.toLowerCase()}-${b.dataset.away.toLowerCase()}`]; ex ? open(ex.id) : start({ home: b.dataset.home, away: b.dataset.away, matchday: +b.dataset.md, date: b.dataset.date }); });
  $("#go").onclick = () => start({ home: $("#h").value, away: $("#a").value });
  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => open(b.dataset.open));
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (confirm("Delete this game and everything counted in it?")) { await api("/games/" + b.dataset.del, "DELETE"); load(); } });
}
async function start(body) { const g = await api("/games", "POST", body); open(g.id); }
function open(id) { location.hash = "#game=" + id; load(); }

/* ---- game ---- */
const ptsOf = r => (r?.ft_m || 0) + 2 * (r?.p2_m || 0) + 3 * (r?.p3_m || 0);
function tally(game) { const t = {}; game.events.forEach(e => { const r = (t[e.pid] ||= {}); r[e.stat] = (r[e.stat] || 0) + 1; }); return t; }
const editable = g => g.status === "open" || g.status === "rejected" || (S.me?.admin && g.status === "submitted");        // the admin may also correct a version waiting for approval

function renderGame() {
  const g = S.game, app = $("#app"), t = tally(g), ed = editable(g);
  const photos = Object.fromEntries(Object.values(S.data.roster).flat().map(p => [p.id, p.photo]));
  const total = code => g.players[code].reduce((n, p) => n + ptsOf(t[p.id]), 0);
  const cc = g.court, picking = S.pick;
  const row = (p, code) => {
    const r = t[p.id] || {}, ph = photos[p.id], on = cc.on[code].includes(p.id), pk = picking && picking.team === code, picked = pk && picking.sel.has(p.id);
    return `<div class="p ${on && !pk ? "on" : ""} ${pk ? "pick" : ""} ${picked ? "picked" : ""}" data-pid="${p.id}" data-team="${code}">
      ${ed ? `<button class="cd ${pk ? "pk" : on ? "on" : ""} ${picked ? "picked" : ""}" data-cd="${p.id}" title="${pk ? "Tap to put him in / out of the five" : on ? "On the court: tap to substitute him" : "On the bench: tap to bring him on"}">${pk ? (picked ? "✓" : "") : on ? "●" : "○"}</button>` : ""}
      <div class="av" ${ph ? `style="background-image:url('${esc(ph)}')"` : ""}>${ph ? "" : p.number}</div>
      <div class="nm" title="${esc(p.name)}"><small>#${p.number}</small> ${esc(p.name)}</div><div class="pts" id="pts-${p.id}">${ptsOf(r)}</div>
      ${cc.used ? `<div class="mn" data-mn="${p.id}" data-team="${code}"><b>${fmt(courtSecs(p.id, code))}</b><span class="${(cc.pm[p.id] || 0) >= 0 ? "pos" : "neg"}">${(cc.pm[p.id] || 0) > 0 ? "+" : ""}${cc.pm[p.id] || 0}</span></div>` : ""}
      <div class="btns">${BTNS.map(b => b ? `<button class="b ${b[2]}" data-stat="${b[0]}" title="${b[3]}" ${ed ? "" : "disabled"}>${b[1]}${r[b[0]] ? `<i>${r[b[0]]}</i>` : ""}</button>` : `<span class="sep"></span>`).join("")}</div></div>`;
  };
  const byId = Object.fromEntries(Object.values(g.players).flat().map(p => [p.id, p]));
  app.innerHTML = `
    <div class="bar"><button id="back">← Matches</button>
      <div class="score">${total(g.home)} – ${total(g.away)}<small>${esc(tn(g.home))} – ${esc(tn(g.away))} · <span class="pill ${g.status}">${STATE[g.status]}</span></small></div>
      ${ed ? clockHtml() : ""}
      <button id="undo" ${ed ? "" : "disabled"} title="Undo the last action (Ctrl/Cmd + Z)">↶ Undo</button><a href="/analytics/api/games/${g.id}/export.csv"><button>Download CSV</button></a>
      ${ed && g.status !== "submitted" ? `<button class="accent" id="submit" title="Send to the admin, who decides if it goes on the site">Send for approval</button>` : ""}${g.status === "submitted" ? `<button id="reopen">Take back to edit</button>` : ""}</div>
    ${g.analyst && g.analyst !== S.me.name ? `<div class="note other">This is the version of <b>${esc(g.analyst)}</b>${S.me.admin ? ": you are editing it as Admin, and every change you make is logged under your name" : ""}.</div>` : ""}
    ${g.status === "rejected" && g.note ? `<div class="note"><b>The admin sent it back:</b> ${esc(g.note)}</div>` : ""}
    ${g.status === "submitted" ? `<div class="note">Sent for approval. You can still take it back to edit it until the admin decides.</div>` : ""}
    ${g.status === "published" ? `<div class="note">Approved: these stats are on the site.</div>` : ""}
    <div class="teams">${[g.home, g.away].map(c => `<div class="team"><h3>${esc(tn(c))}</h3>${courtBar(c, ed)}${g.players[c].map(p => row(p, c)).join("") || '<span class="muted">No players for this team.</span>'}</div>`).join("")}</div>
    <div class="muted legend">Click a button to add it to that player. Green = made shot, red ✗ = missed shot, OR / DR = offensive / defensive rebound. The orange number is how many that player has. Wrong click? Undo, or remove it below.<br>
      <b>On the court:</b> mark the five of each team (● = on the court, ○ = bench). To substitute, tap the player who comes on or goes off and choose who replaces him: his time on the court (it follows the game clock above) and his +/- are counted for you.</div>
    ${historyHtml(g, ed, byId)}`;
  $("#back").onclick = () => { location.hash = ""; load(); };
  $("#undo").onclick = undo;
  if ($("#submit")) $("#submit").onclick = submit;
  if ($("#reopen")) $("#reopen").onclick = async () => { S.game = await api(`/games/${g.id}/reopen`, "POST", {}); renderGame(); };
  clockWire();
  app.querySelectorAll(".b").forEach(b => b.onclick = () => add(b.closest(".p").dataset.pid, b.dataset.stat));
  app.querySelectorAll("[data-cd]").forEach(b => b.onclick = e => { e.stopPropagation(); cdClick(b.closest(".p").dataset.team, b.dataset.cd); });
  app.querySelectorAll(".p.pick").forEach(r => r.onclick = e => { if (!e.target.closest(".b")) cdClick(r.dataset.team, r.dataset.pid); });
  app.querySelectorAll("[data-pickstart]").forEach(b => b.onclick = () => { const c = b.dataset.pickstart; S.pick = { team: c, sel: new Set(S.game.court.on[c]) }; renderGame(); });
  app.querySelectorAll("[data-pickok]").forEach(b => b.onclick = async () => { const pk = S.pick; S.pick = null; await setLineup(pk.team, [...pk.sel]); });
  app.querySelectorAll("[data-pickno]").forEach(b => b.onclick = () => { S.pick = null; renderGame(); });
  histWire();
}
async function add(pid, stat) {
  const y = scrollY;
  const c = clk();
  const at = c.auto && !c.running && c.left > 0 ? (clkStart(c), clkNow(c)) : clkNow(c);     // the clock is an extra: it starts by itself on an action, stop it any time
  S.game = await api(`/games/${S.game.id}/event`, "POST", { pid, stat, q: c.q, t: at });
  const co = S.game.court, code = Object.keys(S.game.players).find(k => S.game.players[k].some(p => p.id === pid));
  if (co.used && co.on[code].length === 5 && !co.on[code].includes(pid)) toast(`${S.game.players[code].find(p => p.id === pid).name} is on the bench: tap ○ to bring him on.`);   // a hint, never a block
  renderGame(); scrollTo(0, y);
  const el = document.getElementById("pts-" + pid); if (el) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 500); }
}
/* ---- history: every action, newest first; the analyst can change or remove any of them, and add one at a given time ---- */
function orderedEvents(g) {
  let now = 0;
  return g.events.map(e => { if (e.q) now = elapsed(e.q, e.t); return [now, e]; }).sort((a, b) => a[0] - b[0] || a[1].n - b[1].n).map(x => x[1]);     // the same order the server uses
}
const clockLbl = e => e.q ? qName(e.q) + " " + fmt(e.t) : e.at;
function evText(g, e) {
  const nm = Object.fromEntries(Object.values(g.players).flat().map(p => [p.id, p.name]));
  return e.stat === "lineup" ? `${tn(e.team)} on the court: ${e.on.map(id => (nm[id] || id).split(" ").slice(-1)[0]).join(", ") || "nobody"}` : `${nm[e.pid] || e.pid} · ${LABEL[e.stat]}`;
}
const playerOpts = (g, sel) => Object.entries(g.players).map(([c, ps]) => `<optgroup label="${esc(tn(c))}">${ps.map(p => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>#${p.number} ${esc(p.name)}</option>`).join("")}</optgroup>`).join("");
const statOpts = sel => BTNS.filter(Boolean).map(b => `<option value="${b[0]}" ${b[0] === sel ? "selected" : ""}>${b[3]}</option>`).join("");
const qOpts = sel => QN.map((n, i) => `<option value="${i + 1}" ${sel === i + 1 ? "selected" : ""}>${n}</option>`).join("");
function historyHtml(g, ed, byId) {
  const seq = orderedEvents(g).reverse(), log = (g.log || []).slice().reverse();
  const c = ed ? clk() : null, nowT = c ? fmt(clkNow(c)) : "";
  const addForm = ed ? `<div class="hform"><b>Add an action</b><select id="af-p">${playerOpts(g)}</select><select id="af-s">${statOpts("p2_m")}</select>
      <select id="af-q">${qOpts(c.q)}</select><input id="af-t" size="5" style="width:70px" value="${nowT}" title="Time left in the quarter (mm:ss); empty = no clock"><button class="accent" id="af-go">Add</button></div>` : "";
  const row = e => {
    const txt = evText(g, e);
    if (S.edit === e.n) return `<div class="hrow editing" data-n="${e.n}"><div class="hform">${e.stat === "lineup" ? `<b>${esc(txt)}</b>` : `<select data-ep>${playerOpts(g, e.pid)}</select><select data-es>${statOpts(e.stat)}</select>`}
        <select data-eq>${qOpts(e.q)}</select><input data-et size="5" style="width:70px" value="${e.q ? fmt(e.t) : ""}" placeholder="mm:ss" title="Time left in the quarter; empty = no clock">
        ${e.stat === "lineup" ? `<button data-hfive="${e.n}">Change the five…</button>` : ""}<button class="accent" data-hsave="${e.n}">Save</button><button data-hcancel>Cancel</button></div></div>`;
    return `<div class="hrow" data-n="${e.n}" data-t="${esc((txt + " " + (e.by || "") + " " + clockLbl(e)).toLowerCase())}"><span class="tm">${esc(clockLbl(e))}</span><span class="by" title="entered by">${esc(e.by || "—")}</span>
      <span>${e.stat === "lineup" ? "🔁 " : ""}${esc(txt)}${e.edited_by ? ` <span class="ed">· changed by ${esc(e.edited_by)}</span>` : ""}</span>
      ${ed ? `<span class="ba"><button data-hedit="${e.n}" title="Change this action">✎</button><button data-rm="${e.n}" title="Remove this action">🗑</button></span>` : "<span></span>"}</div>`;
  };
  return `<div class="hist"><h2>History <span class="muted" style="text-transform:none;letter-spacing:0">${g.events.length} actions · in game order, newest first</span></h2>${addForm}
    <div class="hbar"><input id="hf" placeholder="Filter: a player, an action, an analyst, a time…"></div>
    <div class="hlist" id="hlist">${seq.map(row).join("") || '<div class="muted" style="padding:10px">Nothing yet.</div>'}</div>
    <details class="clog"><summary>Change log (${log.length}): who did what</summary>${log.slice(0, 300).map(l => `<div class="ln"><span>${esc(l.at)}</span><b>${esc(l.by)}</b><span>${esc(l.detail)}</span></div>`).join("") || '<span class="muted">Nothing yet.</span>'}</details></div>`;
}
function parseClock(v) { v = (v || "").trim(); if (!v) return null; const m = v.match(/^(\d{1,2}):(\d{2})$/); return m ? +m[1] * 60 + +m[2] : false; }
function histWire() {
  const app = $("#app"), g = S.game;
  const hf = $("#hf"); if (hf) hf.oninput = () => { const f = hf.value.trim().toLowerCase(); app.querySelectorAll(".hrow[data-t]").forEach(r => { r.hidden = !!f && !r.dataset.t.includes(f); }); };
  app.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => { if (!confirm("Remove this action?")) return; const y = scrollY; S.game = await api(`/games/${g.id}/remove`, "POST", { n: +b.dataset.rm }); renderGame(); scrollTo(0, y); });
  app.querySelectorAll("[data-hedit]").forEach(b => b.onclick = () => { S.edit = +b.dataset.hedit; const y = scrollY; renderGame(); scrollTo(0, y); });
  app.querySelectorAll("[data-hcancel]").forEach(b => b.onclick = () => { S.edit = null; const y = scrollY; renderGame(); scrollTo(0, y); });
  app.querySelectorAll("[data-hsave]").forEach(b => b.onclick = async () => {
    const n = +b.dataset.hsave, row = b.closest(".hrow"), e = g.events.find(x => x.n === n), body = { n };
    const t = parseClock(row.querySelector("[data-et]").value);
    if (t === false) return toast("Write the time like 6:32 (or leave it empty).");
    body.clock = t === null ? null : { q: +row.querySelector("[data-eq]").value, t };
    if (e.stat !== "lineup") { body.pid = row.querySelector("[data-ep]").value; body.stat = row.querySelector("[data-es]").value; }
    S.edit = null; const y = scrollY;
    S.game = await api(`/games/${g.id}/edit`, "POST", body); renderGame(); scrollTo(0, y);
  });
  app.querySelectorAll("[data-hfive]").forEach(b => b.onclick = () => {
    const e = g.events.find(x => x.n === +b.dataset.hfive), sel = new Set(e.on), pl = g.players[e.team];
    const m = document.createElement("div"); m.id = "subm";
    const paint = () => { m.innerHTML = `<div><h4>${esc(tn(e.team))} on the court (${sel.size}/5)</h4>${pl.map(p => `<button class="o" data-id="${p.id}" style="${sel.has(p.id) ? "background:#173d2a" : ""}"><b>#${p.number}</b> ${esc(p.name)}<small>${sel.has(p.id) ? "✓" : ""}</small></button>`).join("")}
      <button class="o accent" data-ok>Save the five</button><button class="o" data-no style="background:transparent;color:var(--muted)">Cancel</button></div>`;
      m.querySelectorAll("[data-id]").forEach(x => x.onclick = () => { sel.has(x.dataset.id) ? sel.delete(x.dataset.id) : sel.size < 5 ? sel.add(x.dataset.id) : toast("Five players at most."); paint(); });
      m.querySelector("[data-no]").onclick = () => m.remove();
      m.querySelector("[data-ok]").onclick = async () => { m.remove(); const y = scrollY; S.game = await api(`/games/${g.id}/edit`, "POST", { n: e.n, on: [...sel] }); renderGame(); scrollTo(0, y); }; };
    paint(); document.body.append(m);
  });
  const go = $("#af-go");
  if (go) go.onclick = async () => {
    const t = parseClock($("#af-t").value);
    if (t === false) return toast("Write the time like 6:32 (or leave it empty).");
    const y = scrollY;
    S.game = await api(`/games/${g.id}/event`, "POST", { pid: $("#af-p").value, stat: $("#af-s").value, ...(t === null ? {} : { q: +$("#af-q").value, t }) });
    renderGame(); scrollTo(0, y); toast("Added.", true);
  };
}
/* ---- who is on the court: five per team, time on the court from the game clock, plus/minus ---- */
const elapsed = (q, left) => { let s = 0; for (let i = 1; i < q; i++) s += len(i); return s + len(q) - left; };
function nowAbs() { const g = S.game; if (!editable(g)) return g.court.end; const c = clk(); return elapsed(c.q, clkNow(c)); }
function courtSecs(pid, code) {
  const c = S.game.court, on = c.on[code].includes(pid);
  return (c.base[pid] || 0) + (on ? Math.max(0, nowAbs() - (c.since[code] || 0)) : 0);
}
function updCourt() {
  if (!S.game?.court?.used) return;
  document.querySelectorAll("[data-mn]").forEach(el => { const b = el.querySelector("b"), v = fmt(courtSecs(el.dataset.mn, el.dataset.team)); if (b && b.textContent !== v) b.textContent = v; });
}
function courtBar(code, ed) {
  const g = S.game, c = g.court, on = c.on[code], pl = Object.fromEntries(g.players[code].map(p => [p.id, p])), pk = S.pick && S.pick.team === code;
  if (pk) return `<div class="courtbar pickbar"><b>Pick the players on the court: ${S.pick.sel.size}/5</b><span class="sp"></span>
    <button class="accent" data-pickok ${S.pick.sel.size === 5 || (S.pick.sel.size && g.players[code].length < 5) ? "" : "disabled"}>Confirm</button><button data-pickno>Cancel</button></div>`;
  if (!on.length) return ed ? `<div class="courtbar"><span class="hint">Who is on the court? Mark the five to get minutes and +/- (optional).</span><span class="sp"></span><button class="accent" data-pickstart="${code}">Pick the five</button></div>` : "";
  return `<div class="courtbar"><span class="muted">On court</span>${on.map(id => `<span class="ch"><span class="av">${pl[id].number}</span>${esc(pl[id].name.split(" ").slice(-1)[0])}</span>`).join("")}${ed ? `<span class="sp"></span><button data-pickstart="${code}" title="Change several players at once">✎ Change the five</button>` : ""}</div>`;
}
function cdClick(code, pid) {
  const g = S.game;
  if (S.pick && S.pick.team === code) {                     // picking the five: tap players in and out, five at most
    const sel = S.pick.sel;
    if (sel.has(pid)) sel.delete(pid); else if (sel.size < 5) sel.add(pid); else return toast("Five players at most: tap one to take him off first.");
    return renderGame();
  }
  const on = g.court.on[code], isOn = on.includes(pid), name = id => g.players[code].find(p => p.id === id)?.name || id;
  if (!on.length) { S.pick = { team: code, sel: new Set([pid]) }; return renderGame(); }          // no five yet: the first tap starts picking it
  const num = id => g.players[code].find(p => p.id === id)?.number ?? 0;
  const others = (isOn ? g.players[code].filter(p => !on.includes(p.id)) : g.players[code].filter(p => on.includes(p.id))).sort((a, b) => a.number - b.number);
  const swap = o => isOn ? on.map(x => x === pid ? o : x) : on.map(x => x === o ? pid : x);
  const m = document.createElement("div"); m.id = "subm";
  m.innerHTML = `<div><h4>${isOn ? `${esc(name(pid))} comes off: who comes on?` : `${esc(name(pid))} comes on: who goes off?`}</h4>
    ${others.map(o => `<button class="o" data-o="${o.id}"><b>#${o.number}</b> ${esc(o.name)}<small>${fmt(courtSecs(o.id, code))}</small></button>`).join("")}
    ${isOn ? `<button class="o" data-o="">Nobody comes on (he just leaves the court)</button>` : on.length < 5 ? `<button class="o" data-o="+">Just add him (the five is not full)</button>` : ""}
    <button class="o" data-o="x" style="background:transparent;color:var(--muted)">Cancel</button></div>`;
  document.body.append(m);
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.querySelectorAll("[data-o]").forEach(b => b.onclick = async () => {
    const o = b.dataset.o; m.remove(); if (o === "x") return;
    await setLineup(code, o === "" ? on.filter(x => x !== pid) : o === "+" ? [...on, pid] : swap(o));
  });
}
async function setLineup(code, ids) {
  const y = scrollY, c = clk();
  S.game = await api(`/games/${S.game.id}/lineup`, "POST", { team: code, on: ids, q: c.q, t: clkNow(c) });      // stamped with the game clock, which is never started or stopped by this
  renderGame(); scrollTo(0, y);
}
/* ---- game clock (optional: stats never need it). Kept in this browser; every action is stamped with the quarter and the time left. ---- */
const QN = ["Q1", "Q2", "Q3", "Q4", "OT1", "OT2", "OT3", "OT4"], len = q => (q > 4 ? 300 : 600);
const qName = q => QN[q - 1] || "Q" + q, fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function clk() {
  const id = "clk-" + S.game.id;
  if (!clk.c || clk.id !== id) { clk.id = id; try { clk.c = JSON.parse(localStorage.getItem(id)); } catch {} clk.c ||= { q: 1, left: 600, running: false, at: 0, auto: true }; }
  return clk.c;
}
const clkSave = () => { try { localStorage.setItem(clk.id, JSON.stringify(clk.c)); } catch {} };
const clkNow = c => c.running ? Math.max(0, c.left - Math.floor((Date.now() - c.at) / 1000)) : c.left;
function clkStart(c) { if (c.left > 0) { c.running = true; c.at = Date.now(); clkSave(); } }
function clkStop(c) { if (c.running) { c.left = clkNow(c); c.running = false; clkSave(); } }
function clockHtml() {
  const c = clk();
  return `<div class="clock" title="Game clock: optional. It starts by itself when you add an action, and you can stop or start it any time.">
    <select id="cq">${QN.map((n, i) => `<option value="${i + 1}" ${c.q === i + 1 ? "selected" : ""}>${n}</option>`).join("")}</select>
    <span class="t ${c.running ? "run" : ""}" id="ct" title="Click to set the time">${fmt(clkNow(c))}</span>
    <button id="cgo">${c.running ? "⏸ Stop" : "▶ Start"}</button>
    <label title="Start the clock by itself when you add an action"><input type="checkbox" id="cauto" ${c.auto ? "checked" : ""}> auto</label></div>`;
}
function clockWire() {
  if (!$("#cgo")) return;
  const c = clk(), paint = () => { const t = $("#ct"); if (!t) return; updCourt(); const n = clkNow(c); t.textContent = fmt(n); t.classList.toggle("run", c.running); $("#cgo").textContent = c.running ? "⏸ Stop" : "▶ Start";
    if (c.running && n === 0) { clkStop(c); paint(); toast("End of " + qName(c.q), true); } };
  $("#cgo").onclick = () => { c.running ? clkStop(c) : clkStart(c); paint(); };
  $("#cq").onchange = e => { clkStop(c); c.q = +e.target.value; c.left = len(c.q); clkSave(); paint(); };
  $("#cauto").onchange = e => { c.auto = e.target.checked; clkSave(); };
  $("#ct").onclick = () => {
    const v = prompt("Time left in the quarter (mm:ss):", fmt(clkNow(c))); if (v === null) return;
    const m = v.trim().match(/^(\d{1,2}):(\d{2})$/); if (!m) return toast("Write it like 6:32");
    clkStop(c); c.left = Math.min(3600, +m[1] * 60 + +m[2]); clkSave(); paint();
  };
  clearInterval(clockWire.timer); clockWire.timer = setInterval(paint, 250);
}
async function undo() { if (!editable(S.game)) return; const y = scrollY; S.game = await api(`/games/${S.game.id}/undo`, "POST", {}); renderGame(); scrollTo(0, y); }
async function submit() {
  const g = S.game;
  const md = prompt("Matchday number of this game (e.g. 12):", g.matchday || ""); if (md === null) return;
  const date = prompt("Date of the game (YYYY-MM-DD):", g.date || new Date().toISOString().slice(0, 10)); if (date === null) return;
  const c = clk();
  S.game = await api(`/games/${g.id}/submit`, "POST", { matchday: parseInt(md, 10), date: date.trim(), q: c.q, t: clkNow(c) });
  toast("Sent to the admin.", true); renderGame();
}
addEventListener("keydown", e => { if (S.game && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); } });
addEventListener("hashchange", load);
load();
</script>
